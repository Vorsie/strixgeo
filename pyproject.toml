[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundmodel"
version = "0.1.0"
description = "Ground model platform for geotechnical data: CPT / borehole / lab ingestion, characterisation, and exports to design tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0,<3",  # cap major: a `uv lock --upgrade` must not pull v3 (#219)
    "alembic>=1.13",
    "asyncpg>=0.29",
    "polars>=0.20,<2",  # cap major: pin below the next breaking Polars major (#219)
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "uuid6>=2.0",
    "geoalchemy2>=0.15",
    "python-multipart>=0.0.27",
    "httpx[http2]>=0.27",
    "pyproj>=3.6",
    # defusedxml — every DOV XML parser routes through this instead of
    # stdlib ``xml.etree.ElementTree``. Stdlib ET is vulnerable to
    # billion-laughs entity expansion + external DTD fetches; defusedxml
    # is a drop-in API replacement with those guards on by default. DOV
    # is a trusted source today, but a MITM serving a malicious response
    # could still wedge an import — and the bundle-restore path could
    # eventually load XML from a user-shared .gmproj where the recipient
    # doesn't trust the sender. See debt #12.
    "defusedxml>=0.7.1",
    # ezdxf — DXF writer for the section exporter (v1.0 MVP gate #5).
    # Pure Python, no native deps, generates AutoCAD-compatible R2018
    # output that Plaxis / D-Sheet / GeoStudio all import cleanly.
    # Chosen over manual DXF text generation because the format is full
    # of fiddly section headers / handles / colour-index lookups that
    # ezdxf already handles correctly.
    "ezdxf>=1.3",
    # Pillow reads the GeoTIFF blobs we sample from DHMVII WCS for the
    # cross-section DEM ground-line. Chosen over tifffile + numpy
    # because it ships pre-built wheels everywhere, handles 32-bit
    # float TIFFs natively, and ``getpixel`` / ``crop`` are all the
    # sampler needs — no array-math dependency creep.
    "Pillow>=10.0",
    # SciPy — Delaunay triangulation for the geological model's TIN
    # surfaces (one TIN per formation, computed from its contacts).
    # ``scipy.spatial.Delaunay`` is the standard battle-tested
    # implementation; we use the qhull backend it wraps. Method-
    # agnostic surface schema means a future Phase 5 GemPy / kriging
    # engine can drop in alongside without removing this; TIN stays
    # the interactive default because Delaunay on tens of points is
    # sub-millisecond, suitable for "drag a contact and see the
    # surface refresh" UX.
    "scipy>=1.13,<2",  # cap major: pin below the next breaking SciPy major (#219)
    "numba>=0.65.1",
    # Deltares GEOLib — the official Python wrapper for the whole D-Series.
    # Writes D-Stability ``.stix`` and D-Sheet Piling ``.shi`` in-process, so
    # no D-Series installation is needed on the build machine or in CI, and one
    # dependency covers every future D-Series target (D-Settlement,
    # D-Foundations). Chosen over hand-writing the formats because ``.stix`` is
    # a zip of a dozen interlinked JSON documents with id cross-references, and
    # ``.shi`` is D-Series fixed-column ASCII — both are exactly the kind of
    # fiddly serialisation a maintained upstream should own. Floor 2.9.1: the
    # first release that is pydantic-v2 native, so it coexists with our
    # ``pydantic>=2.7`` without a shim. Pulls shapely / jinja2 / requests /
    # pydantic-extra-types. Version-specific quirks are tabulated in
    # docs/exports.md — re-verify that table on any upgrade.
    "d-geolib>=2.9.1",
    # PyMuPDF — the PDF CPT digitiser (Data -> Import -> CPTs from a PDF
    # report). Reads the drawing commands and the text layer of a vector
    # report; that path needs nothing else. A prebuilt wheel carrying its own
    # MuPDF DLL, so the embedded-Python installer ships it like numba's
    # llvmlite (docs/distribution-build.md).
    "pymupdf>=1.28.2",
]

# Optional extras. ``pdf-ocr`` — tick-label OCR and scanned / pasted-image
# pages for the PDF CPT digitiser (owner 2026-09-30: OCR stays OPTIONAL).
# RapidOCR runs an ONNX model and brings OpenCV; both are imported lazily
# (``optional_engines``), so without the extra the vector path still works and
# the UI asks the user to type the axis values.
[project.optional-dependencies]
pdf-ocr = [
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",
    # openpyxl — only used by scripts/build_g3dv3_catalog.py to rebuild
    # the G3Dv3 stratigraphic catalog JSON from the DOV xlsx sources.
    # Not a runtime dep; the JSON is consumed at runtime.
    "openpyxl>=3.1",
    # The pdf-ocr extra's engines, so the digitiser's raster / OCR tests run
    # in dev and CI (the extra itself is opt-in for the shipped tree).
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python>=5.0.0.93",
]
# compile — the native-compilation toolchain for the packaged tree ONLY.
# Nuitka translates the engine + parsers to C and builds one .pyd per module so
# the distributed backend does not ship those modules as readable .py (owner
# ruling 2026-08-31 — the codebase must not leak from a shipped binary). This is
# a BUILD-TIME group, never a runtime dependency: it is wired into the dev .venv
# with `uv sync --group compile` and driven by scripts/compile-backend-natives.ps1.
# It is deliberately NOT a default group, so `uv export --no-dev` (which
# build-embedded-python.ps1 uses to pin the shipped site-packages) excludes it —
# Nuitka never lands in the installer. Pinned to the spike-proven 4.2 line;
# capped below 5 so a `uv lock --upgrade` cannot pull a breaking major that
# changes the module-mode CLI the driver depends on.
compile = ["nuitka>=4.2,<5"]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-mathjax-offline>=0.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "--benchmark-disable"  # benchmarks only run via: uv run pytest tests/benchmarks/ --benchmark-enable
markers = [
    # A test that spawns real OS processes / does real I/O, so it is slower than
    # a pure-logic unit test (still only a couple of seconds). It stays in the
    # normal unit suite; the marker only labels it, and is registered here so it
    # does not raise an "unknown mark" warning.
    "slow: real-process / real-I/O test, slower than a pure-logic unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D1"]
ignore = ["D105", "D107"]
# F401 (unused imports) stays a WARNING but is not auto-fixable — the
# PostToolUse formatter hook in .claude/hooks/ruff_format.py runs after
# every file write, and it would otherwise aggressively strip imports we
# add in one Edit before we add their usage in a follow-up Edit. Keeping
# the warning means real dead imports still surface in ``ruff check``;
# making the rule unfixable means auto-fix can't surprise-delete them.
unfixable = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true

# Numba ships no type stubs / py.typed marker. Ignore its missing imports
# project-wide so every ``from numba import ...`` does not need a per-line
# suppression (the JIT'd kernels themselves still carry a localised
# ``# type: ignore[untyped-decorator]`` on the ``@njit`` decorator, which
# strict mode flags because the decorator is untyped).
[[tool.mypy.overrides]]
module = ["numba.*"]
ignore_missing_imports = true

# Deltares GEOLib (``d-geolib``) is fully type-annotated internally — it is a
# pydantic-v2 codebase — but ships no ``py.typed`` marker, so mypy refuses to
# read those annotations. Ignore its missing imports project-wide rather than
# per-line: the two D-Series exporters touch a dozen of its submodules each,
# and a suppression on every import line would bury the real errors.
[[tool.mypy.overrides]]
module = ["geolib.*"]
ignore_missing_imports = true

# shapely 2.x ships no py.typed; the DXF exporter unions the fill regions with it.
[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

# PyMuPDF (the PDF CPT digitiser, runtime dep) is only partly annotated: Page /
# Rect / Document methods are untyped, so strict mode flags every call. Allow
# untyped calls inside the digitiser package only; RapidOCR ships no types.
[[tool.mypy.overrides]]
module = ["groundmodel.infrastructure.parsers.cpt.pdf.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*"]
ignore_missing_imports = true

# asyncpg ships no ``py.typed`` marker (verified 2026-08-27 against 0.29+),
# so mypy cannot see its inline annotations even though the library is typed
# internally. Used directly (not through SQLAlchemy) by `DatabaseMigrator`
# for cluster bring-up — see `docs/distribution-db-decision.md`.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
