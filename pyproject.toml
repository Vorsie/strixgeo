[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundmodel"
version = "0.1.0"
description = "Geotechnical data platform — EC7 Gen2 compliant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "polars>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "uuid6>=2.0",
    "geoalchemy2>=0.15",
    "python-multipart>=0.0.27",
    "httpx[http2]>=0.27",
    "pyproj>=3.6",
    # defusedxml — every DOV XML parser routes through this instead of
    # stdlib ``xml.etree.ElementTree``. Stdlib ET is vulnerable to
    # billion-laughs entity expansion + external DTD fetches; defusedxml
    # is a drop-in API replacement with those guards on by default. DOV
    # is a trusted source today, but a MITM serving a malicious response
    # could still wedge an import — and the bundle-restore path could
    # eventually load XML from a user-shared .gmproj where the recipient
    # doesn't trust the sender. See debt #12.
    "defusedxml>=0.7.1",
    # Pillow reads the GeoTIFF blobs we sample from DHMVII WCS for the
    # cross-section DEM ground-line. Chosen over tifffile + numpy
    # because it ships pre-built wheels everywhere, handles 32-bit
    # float TIFFs natively, and ``getpixel`` / ``crop`` are all the
    # sampler needs — no array-math dependency creep.
    "Pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5",
    "factory-boy>=3.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "bench_*.py"]
addopts = "--benchmark-disable"  # benchmarks only run via: uv run pytest tests/benchmarks/ --benchmark-enable

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D1"]
ignore = ["D105", "D107"]
# F401 (unused imports) stays a WARNING but is not auto-fixable — the
# PostToolUse formatter hook in .claude/hooks/ruff_format.py runs after
# every file write, and it would otherwise aggressively strip imports we
# add in one Edit before we add their usage in a follow-up Edit. Keeping
# the warning means real dead imports still surface in ``ruff check``;
# making the rule unfixable means auto-fix can't surprise-delete them.
unfixable = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
