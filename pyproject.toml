[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundmodel"
version = "0.1.0"
description = "Geotechnical data platform — EC7 Gen2 compliant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "polars>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "uuid6>=2.0",
    "geoalchemy2>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "factory-boy>=3.3",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D1"]
ignore = ["D105", "D107"]

[tool.mypy]
python_version = "3.11"
strict = true
