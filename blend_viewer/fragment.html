<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>One thick unit, cut into pieces — three ways to end a thin unit</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --dim:#94a3b8;
          --drawn:#e2e8f0; --today:#38bdf8; --cand:#a5b4fc; --frag:#ff2d55; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  /* The controls sit INSIDE this block, in flow, so a blurb that wraps to a third
     line can never push the buttons under itself. The right padding keeps both
     clear of the case picker. */
  #hud { position:absolute; top:0; left:0; right:0; padding:13px 356px 34px 18px; z-index:10;
    background:linear-gradient(180deg, rgba(15,23,42,.97) 76%, rgba(15,23,42,0));
    pointer-events:none; }
  h1 { font-size:16px; margin:0 0 3px; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; max-width:112ch; }
  .sub b { color:var(--ink); font-weight:600; }
  .sub .frag { color:#ff8fa8; font-weight:600; }
  #mix, #counts, #stats { color:var(--dim); font-size:12.5px; margin-top:3px; }
  #mix b, #counts b, #stats b { color:var(--ink); font-weight:600;
    font-variant-numeric:tabular-nums; }
  #stats { color:#7c8ba1; font-size:12px; }
  #counts .drawn { color:#e2e8f0; font-weight:600; }
  #counts .today { color:#7dd3fc; font-weight:600; }
  #counts .cand { color:#c7d2fe; font-weight:600; }
  #counts .sep { color:#475569; }
  #controls { margin-top:11px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    pointer-events:auto; }
  button { font:inherit; font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button.on { background:#38bdf8; color:#06263a; border-color:#38bdf8; font-weight:600; }
  button:hover { border-color:#5b7a99; }
  .grp { display:flex; gap:6px; align-items:center; background:rgba(30,41,59,.72);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px;
    color:var(--dim); }
  .grp span.val { color:var(--ink); font-variant-numeric:tabular-nums; }
  input[type=range] { width:120px; accent-color:#38bdf8; }
  #cases { position:absolute; top:172px; right:18px; z-index:11; width:322px;
    max-height:calc(100vh - 232px); display:flex; flex-direction:column;
    background:rgba(11,18,32,.88); border:1px solid var(--line); border-radius:9px;
    padding:9px 10px; }
  #casesHdr, #notesHdr { font-size:11.5px; color:var(--dim); text-transform:uppercase;
    letter-spacing:.06em; margin-bottom:6px; }
  #notesHdr { margin-top:9px; padding-top:9px; border-top:1px solid var(--line); }
  #caseList { overflow-y:auto; display:flex; flex-direction:column; gap:4px;
    max-height:42vh; flex:0 1 auto; }
  #noteList { overflow-y:auto; display:flex; flex-direction:column; gap:5px;
    max-height:34vh; font-size:11.5px; color:#9fb0c6; }
  #noteList div { padding-left:11px; text-indent:-11px; }
  /* The footprint caveat is not a description of the case, it is a warning that
     the model labels no ground here at all. */
  #noteList div.warn { color:#fcd34d; }
  .crow { display:flex; gap:8px; align-items:baseline; width:100%; text-align:left;
    padding:5px 8px; font-size:12px; }
  /* Beats `button.on`, whose cyan fill would swallow the row's own colour coding. */
  .crow.on { background:#0d3a52; color:var(--ink); border-color:#38bdf8; font-weight:400; }
  .crow .cxy { font-variant-numeric:tabular-nums; color:var(--dim); }
  .crow.on .cxy { color:var(--ink); }
  .crow .cform { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:#93c5fd; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .crow .csplit { font-variant-numeric:tabular-nums; color:#ff8fa8; font-weight:600; }
  #legend { position:absolute; left:18px; bottom:16px; z-index:11; font-size:12px;
    color:var(--dim); background:rgba(11,18,32,.86); padding:9px 13px; border-radius:8px;
    border:1px solid var(--line); max-width:44ch; }
  #legend div { margin:2px 0; }
  #legend i { display:inline-block; width:14px; height:10px; vertical-align:0;
    margin-right:8px; border-radius:2px; }
  /* Beats the `#legend i` fill rule: these two rows show an OUTLINE, not a fill. */
  #legend i.ring { background:transparent; border:2px solid var(--frag); border-radius:2px;
    width:14px; height:10px; }
  #legend i.frame { background:transparent; border:2px solid #cbd5e1; border-radius:2px; }
  #legendForms { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
  #hint { position:absolute; right:18px; bottom:16px; z-index:11; font-size:11.5px;
    color:var(--dim); text-align:right; }
  #err { position:absolute; inset:0; display:grid; place-items:center; z-index:20;
    background:rgba(15,23,42,.94); font-size:14px; color:#fca5a5; text-align:center;
    padding:40px; }
  #errBox { max-width:78ch; }
  #errBox p { margin:0 0 10px; }
  #errBox code { color:#e2e8f0; background:#1e293b; padding:2px 6px; border-radius:4px;
    font-size:12.5px; }
  #errBox .note { color:var(--dim); font-size:12.5px; text-align:left; }
  #errBox .schema { color:var(--dim); font-size:12px; text-align:left; white-space:pre-wrap;
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; background:#111c31;
    border:1px solid var(--line); border-radius:7px; padding:9px 11px; margin:0 0 12px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <h1>One thick unit, cut into pieces — three ways to end a thin unit</h1>
  <div class="sub" id="sub">loading…</div>
  <div id="mix"></div>
  <div id="counts"></div>
  <div id="stats"></div>
  <div id="controls">
    <div class="grp">
      vertical&nbsp;×<span class="val" id="veLabel">8</span>
      <input type="range" id="ve" min="1" max="40" step="1" value="8" />
    </div>
    <button id="outlineBtn" class="on">interval outlines</button>
    <button id="fitBtn">recentre</button>
  </div>
</div>
<div id="cases">
  <div id="casesHdr">fragmentation cases — worst split first</div>
  <div id="caseList"></div>
  <div id="notesHdr">what this case shows</div>
  <div id="noteList"></div>
</div>
<div id="legend"></div>
<div id="hint">drag to orbit · wheel to zoom · right-drag to pan</div>
<div id="err"><div id="errBox">
  <p id="errMsg">waiting for the payload…</p>
  <p class="note" id="errNote"></p>
  <p class="schema" id="errSchema"></p>
  <button id="retryBtn">retry now</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/*
 * DEBT #261 — the blend fragments a body neither drawn section fragments.
 *
 * Five stratigraphic columns in a row, at true elevations, coloured by formation:
 *
 *     SECTION A as drawn | TODAY | THIN | OUTSIDE | SECTION B as drawn
 *
 * The two DRAWN columns sit at the outside because the question is what should
 * happen BETWEEN them; the three computed columns sit between them so the row
 * reads left to right. TODAY is the blend as shipped — the one-sided unit laid
 * out at its own mid, splitting the matched body around it. THIN and OUTSIDE are
 * the two candidate rules. NONE of the three is endorsed here; this page exists
 * so the owner can look at all three and rule.
 *
 * The payload is written by a separate dump script. Its field names are read
 * tolerantly (snake_case and camelCase, several spellings per field) because
 * the two halves are built in parallel; see `readMissingSchemaText` for the
 * shape this page expects, which is also what it prints on screen when the
 * payload is absent or unreadable.
 */
let DATA = null, sel = 0, VE = 8;
let showOutlines = true;
let scene, camera, renderer, controls, root;
let cases = [];
let labelSprites = [];
let centreZ = 0;
let pollTimer = null;
let colourCache = new Map();
let payloadColours = new Map();

/** Column footprint and spacing in scene units — metres on the horizontal axes. */
const COL_W = 26;
const COL_D = 26;
const COL_PITCH = 54;

/**
 * The thinnest box drawn, in scene units.
 *
 * A candidate rule can thin a unit to nothing, and a zero-height box renders as
 * nothing at all — which reads as "the unit is gone" when what happened is "the
 * unit is here with no thickness". A hairline says the difference.
 */
const MIN_BOX_H = 0.14;

/**
 * The direction the fit looks from — nearly front-on, lifted and turned slightly.
 *
 * The other viewers in this folder use a three-quarter view because they show
 * ground in map space. Here the whole point is comparing five columns in a fixed
 * left-to-right order, and a three-quarter view foreshortens the far end of the
 * row until the reading order stops being legible. Front-on with a small lift
 * keeps the order and still shows the boxes as solids.
 */
const VIEW_DIR = [0.20, 0.34, 1.0];

/**
 * A narrow field of view, standing further back.
 *
 * At the 45 degrees the other viewers use, a row this wide keystones: the outer
 * columns lean in and their contacts stop lining up with the inner ones by eye,
 * which is exactly the comparison this page is for. A long lens costs nothing
 * here because there is no landscape to feel depth in.
 */
const FOV = 32;

/** Formation colours used when the payload does not carry its own. */
const FORMATION_COLOUR = {
  ZAND: 0xf5d78e, SILT: 0xc7b299, KLEI: 0x8fa9b8, VEEN: 0x8a6f4e, LEEM: 0xbfae8f,
  GRIND: 0xd9b382, TURF: 0x7a5c3e, SLIB: 0x9fb0a8,
};

/** Stable fallback palette for formation names the map above does not know. */
const PALETTE = [
  0xe6b980, 0x9fc0d4, 0xb9a7c8, 0x9fc9a8, 0xd7a1a1, 0xc9c08a,
  0x8fb3c9, 0xcaa78f, 0xa8b9d6, 0xbfc4a4, 0xd2a3bd, 0x93b8ae,
];

/**
 * The share of the canvas each fixed panel covers, which the fit must not use.
 *
 * The blurb and the controls sit over the top of the canvas, the case picker
 * over the upper right, the legend over the lower left. Framing the drawing to
 * the whole canvas puts the column headings underneath the blurb, which is
 * where two earlier attempts at this page left them.
 */
const SAFE_TOP = 0.20;
const SAFE_BOTTOM = 0.03;
const SAFE_LEFT = 0.19;
const SAFE_RIGHT = 0.21;

const OUTLINE_COLOUR = 0x0b1220;
const FRAG_COLOUR = 0xff2d55;
const FRAME_COLOUR = 0xcbd5e1;
const GUIDE_COLOUR = 0x3b4d68;
const AXIS_COLOUR = 0x64748b;

/** The roles drawn, in the order they are drawn, with the names read from a payload. */
const ROLES = [
  {
    key: 'section_a', title: 'SECTION A', note: 'as drawn', drawn: true,
    aliases: ['section_a', 'sectiona', 'a', 'drawn_a', 'a_drawn', 'left', 'section_a_drawn'],
  },
  {
    key: 'today', title: 'TODAY', note: 'the blend as shipped', drawn: false,
    aliases: ['today', 'blend', 'shipped', 'blend_today', 'current', 'as_shipped'],
  },
  {
    key: 'thin', title: 'THIN', note: 'candidate', drawn: false,
    aliases: ['thin', 'thinned', 'taper', 'tapered', 'candidate_thin', 'thin_candidate'],
  },
  {
    key: 'outside', title: 'OUTSIDE', note: 'candidate', drawn: false,
    aliases: ['outside', 'above_below', 'candidate_outside', 'outside_candidate', 'outside_rule'],
  },
  {
    key: 'section_b', title: 'SECTION B', note: 'as drawn', drawn: true,
    aliases: ['section_b', 'sectionb', 'b', 'drawn_b', 'b_drawn', 'right', 'section_b_drawn'],
  },
];

// ---------------------------------------------------------------------------
// Payload reading — deliberately forgiving about names
// ---------------------------------------------------------------------------

/**
 * First present value among several candidate keys.
 *
 * Parameters
 * ----------
 * obj : object
 *     The object to read.
 * names : Array of string
 *     Candidate keys, most likely first. Matching ignores case, underscores
 *     and hyphens, so `body_id`, `bodyId` and `BodyID` all hit `body_id`.
 *
 * Returns
 * -------
 * any
 *     The value, or `undefined` when no candidate is present.
 */
function pick(obj, names) {
  if (!obj || typeof obj !== 'object') return undefined;
  const flat = new Map();
  for (const k of Object.keys(obj)) flat.set(k.toLowerCase().replace(/[_-]/g, ''), obj[k]);
  for (const n of names) {
    const v = flat.get(n.toLowerCase().replace(/[_-]/g, ''));
    if (v !== undefined && v !== null) return v;
  }
  return undefined;
}

/** A finite number, or null — strings that look numeric are accepted. */
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(v);
  return Number.isFinite(n) ? n : null;
}

/** A trimmed non-empty string, or null. */
function str(v) {
  if (typeof v !== 'string') return null;
  const t = v.trim();
  return t ? t : null;
}

/**
 * One interval of a column, normalised.
 *
 * Returns null when the entry has no usable pair of elevations: a box needs a
 * top and a base, and silently drawing a guessed one would be worse than
 * leaving it out and saying so in the count.
 */
function normaliseInterval(raw) {
  if (!raw || typeof raw !== 'object') return null;
  let top = num(pick(raw, ['top', 'top_elev', 'z_top', 'elev_top', 'upper', 'top_m']));
  let base = num(pick(raw, ['base', 'base_elev', 'z_base', 'elev_base', 'bottom', 'lower', 'base_m']));
  if (top === null || base === null) return null;
  // Elevations, so the top is the larger number; a payload that stored them the
  // other way round still draws the same box.
  if (top < base) { const t = top; top = base; base = t; }
  const formationId = str(pick(raw, ['formation_id', 'formationid', 'form_id']));
  const formationName = str(pick(raw, ['formation', 'formation_name', 'form', 'name', 'label']));
  return {
    top,
    base,
    formationId,
    formationName: formationName || formationId || 'unnamed',
    bodyId: str(pick(raw, ['body_id', 'body', 'bodyid'])),
    bodyShort: str(pick(raw, ['body_short', 'short', 'bodyshort'])),
    flagged: pick(raw, ['fragmented', 'is_fragmented', 'split', 'is_split']) === true,
  };
}

/**
 * One column of intervals for a role, normalised.
 *
 * The payload may hold columns as an object keyed by role, as an array of
 * column objects each naming its role, or as role keys sitting directly on the
 * case. All three are read.
 */
function normaliseColumn(source, role) {
  let rawCol;
  if (Array.isArray(source)) {
    rawCol = source.find((c) => {
      const k = str(pick(c, ['key', 'role', 'id', 'column', 'name', 'slot']));
      if (!k) return false;
      const flat = k.toLowerCase().replace(/[_ -]/g, '');
      return role.aliases.some((a) => a.replace(/[_-]/g, '') === flat);
    });
  } else {
    rawCol = pick(source, role.aliases);
  }
  if (rawCol === undefined) return { key: role.key, role, present: false, intervals: [], name: null };

  const rawIntervals = Array.isArray(rawCol)
    ? rawCol
    : (pick(rawCol, ['intervals', 'entries', 'stack', 'layers', 'items']) || []);
  const intervals = (Array.isArray(rawIntervals) ? rawIntervals : [])
    .map(normaliseInterval)
    .filter((iv) => iv !== null);
  // Shallow to deep, so the labels and the spans below can trust the order.
  intervals.sort((a, b) => b.top - a.top);
  const name = Array.isArray(rawCol)
    ? null
    : str(pick(rawCol, ['name', 'section', 'section_name', 'title', 'label']));
  // A payload may use `section_a` for the SECTION's name and distance while the
  // stacks live under `columns`. Such an object is not an empty column — it is
  // no column at all, and saying "absent" is truer than saying "empty".
  const isColumn = Array.isArray(rawCol)
    || pick(rawCol, ['intervals', 'entries', 'stack', 'layers', 'items']) !== undefined;
  return { key: role.key, role, present: isColumn, intervals, name };
}

/** The name and stand-off distance of one of the two drawn sections. */
function sectionInfo(raw, which) {
  const direct = pick(raw, which === 0
    ? ['section_a', 'sectionA', 'a_section']
    : ['section_b', 'sectionB', 'b_section']);
  let name = null;
  let dist = null;
  // `section_a` may BE the column (an array of intervals); only an object names it.
  if (direct && typeof direct === 'object' && !Array.isArray(direct)) {
    name = str(pick(direct, ['name', 'label', 'short', 'section', 'title']));
    dist = num(pick(direct, ['distance_m', 'distance', 'dist_m', 'dist', 'perp_m']));
  } else if (typeof direct === 'string') {
    name = str(direct);
  }
  if (name === null) {
    name = str(pick(raw, which === 0
      ? ['section_a_name', 'a_name', 'name_a']
      : ['section_b_name', 'b_name', 'name_b']));
  }
  if (dist === null) {
    dist = num(pick(raw, which === 0
      ? ['section_a_distance_m', 'a_distance_m', 'distance_a_m', 'd1', 'dist_a_m']
      : ['section_b_distance_m', 'b_distance_m', 'distance_b_m', 'd2', 'dist_b_m']));
  }
  const list = pick(raw, ['sections', 'nearest', 'nearest_sections']);
  if (Array.isArray(list) && list[which]) {
    const s = list[which];
    if (name === null) name = str(pick(s, ['name', 'label', 'short', 'section', 'title']));
    if (dist === null) dist = num(pick(s, ['distance_m', 'distance', 'dist_m', 'dist', 'perp_m']));
  }
  return { name, dist };
}

/** How many intervals of one body a column carries. */
function countOf(column, bodyId) {
  let n = 0;
  for (const iv of column.intervals) if (iv.bodyId === bodyId) n += 1;
  return n;
}

/**
 * The bodies this case fragments, and the worst split among them.
 *
 * The payload is asked first — it knows what it measured. When it says nothing,
 * the same shape is derived here: a body is fragmented when some computed column
 * carries it in more pieces than any drawn column does. That derivation exists
 * so the page is still readable against an early payload, and it is reported as
 * derived rather than passed off as measured.
 */
function fragmentation(raw, columns) {
  const ids = new Set();
  const add = (v) => {
    if (typeof v === 'string' && v.trim()) ids.add(v.trim());
    else if (v && typeof v === 'object') {
      const id = str(pick(v, ['body_id', 'body', 'id']));
      if (id) ids.add(id);
    }
  };
  const listed = pick(raw, ['fragmented_bodies', 'fragmented', 'split_bodies', 'fragments']);
  if (Array.isArray(listed)) listed.forEach(add);
  else if (listed && typeof listed === 'object') {
    for (const k of Object.keys(listed)) if (listed[k]) ids.add(k);
  }
  const worstRaw = pick(raw, ['worst_split', 'worst', 'headline', 'worst_body']);
  if (worstRaw) add(worstRaw);
  for (const col of columns) {
    for (const iv of col.intervals) if (iv.flagged && iv.bodyId) ids.add(iv.bodyId);
  }

  const drawn = columns.filter((c) => c.role.drawn);
  const computed = columns.filter((c) => !c.role.drawn);
  let derived = false;
  if (!ids.size) {
    const seen = new Set();
    for (const col of columns) for (const iv of col.intervals) if (iv.bodyId) seen.add(iv.bodyId);
    for (const id of seen) {
      const asDrawn = Math.max(0, ...drawn.map((c) => countOf(c, id)));
      const inBlend = Math.max(0, ...computed.map((c) => countOf(c, id)));
      if (inBlend > asDrawn && inBlend > 1) { ids.add(id); derived = true; }
    }
  }

  let worst = null;
  for (const id of ids) {
    const asDrawn = Math.max(0, ...drawn.map((c) => countOf(c, id)));
    const inBlend = Math.max(0, ...computed.map((c) => countOf(c, id)));
    const entry = { bodyId: id, asDrawn, inBlend };
    if (!worst || inBlend - asDrawn > worst.inBlend - worst.asDrawn) worst = entry;
  }
  // A payload that states the split outright wins over the counted one.
  if (worstRaw && typeof worstRaw === 'object' && worst) {
    const a = num(pick(worstRaw, ['on_section', 'as_drawn', 'drawn', 'from', 'before']));
    const b = num(pick(worstRaw, ['in_blend', 'blend', 'to', 'after', 'pieces']));
    if (a !== null) worst.asDrawn = a;
    if (b !== null) worst.inBlend = b;
  }
  return { ids, worst, derived };
}

/** The formation and short label of a body, taken from wherever it appears. */
function bodyFacts(columns, bodyId) {
  for (const col of columns) {
    for (const iv of col.intervals) {
      if (iv.bodyId === bodyId) {
        return { formation: iv.formationName, short: iv.bodyShort || bodyId.slice(0, 13) };
      }
    }
  }
  return { formation: null, short: bodyId ? bodyId.slice(0, 13) : '—' };
}

/** One case, normalised into what `build` and the HUD read. */
function normaliseCase(raw, index) {
  const source = pick(raw, ['columns', 'stacks', 'panels', 'stack']) || raw;
  const columns = ROLES.map((role) => normaliseColumn(source, role));
  const frag = fragmentation(raw, columns);
  const point = pick(raw, ['point', 'xy', 'position']);
  const x = num(pick(raw, ['x', 'easting', 'ex', 'col_x']))
    ?? (Array.isArray(point) ? num(point[0]) : null);
  const y = num(pick(raw, ['y', 'northing', 'ny', 'col_y']))
    ?? (Array.isArray(point) ? num(point[1]) : null);
  let w1 = num(pick(raw, ['w1', 'weight1', 'weight_a', 'wa']));
  let w2 = num(pick(raw, ['w2', 'weight2', 'weight_b', 'wb']));
  if (w1 !== null && w2 === null) w2 = 1 - w1;
  if (w2 !== null && w1 === null) w1 = 1 - w2;
  const worstFacts = frag.worst ? bodyFacts(columns, frag.worst.bodyId) : { formation: null, short: '—' };
  // The payload's own remarks on the case — which rule drops which units, where a
  // candidate leaves a host still split, whether the column is even inside the
  // built footprint. They are the half of the comparison the boxes cannot show,
  // so they are carried through verbatim rather than summarised.
  const rawNotes = pick(raw, ['notes', 'remarks', 'observations']);
  const notes = Array.isArray(rawNotes) ? rawNotes.map(str).filter((n) => n) : [];
  return {
    index,
    label: str(pick(raw, ['label', 'title', 'name'])),
    short: str(pick(raw, ['short', 'id', 'case'])),
    x,
    y,
    w1,
    w2,
    notes,
    inFootprint: pick(raw, ['inFootprint', 'in_footprint']) !== false,
    a: sectionInfo(raw, 0),
    b: sectionInfo(raw, 1),
    columns,
    fragIds: frag.ids,
    worst: frag.worst,
    fragDerived: frag.derived,
    worstFormation: worstFacts.formation,
    worstShort: worstFacts.short,
  };
}

// ---------------------------------------------------------------------------
// Colour
// ---------------------------------------------------------------------------

/** A payload colour in any of `#rrggbb`, `rrggbb` or a number, as an integer. */
function parseColour(v) {
  if (typeof v === 'number' && Number.isFinite(v)) return v;
  const s = str(v);
  if (!s) return null;
  const hex = s.replace(/^#/, '');
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;
  return parseInt(hex, 16);
}

/** A small stable hash, so an unknown formation keeps its colour between runs. */
function hashOf(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h);
}

/**
 * The colour for one interval, consistent across every column.
 *
 * The payload's own `formationColours` wins — it is what the rest of the model
 * renders with. Then the named lithology defaults, then a stable hash palette,
 * so a formation this page has never seen still gets one colour everywhere
 * rather than a different one per column.
 */
function colourFor(interval) {
  const keys = [interval.formationId, interval.formationName].filter((k) => k);
  for (const k of keys) {
    const direct = payloadColours.get(k) ?? payloadColours.get(k.toLowerCase());
    if (direct !== undefined) return direct;
  }
  const name = interval.formationName || interval.formationId || 'unnamed';
  if (colourCache.has(name)) return colourCache.get(name);
  const token = name.toUpperCase().split(/[^A-Z]+/).filter((t) => t)[0] || '';
  const colour = FORMATION_COLOUR[token] ?? PALETTE[hashOf(name) % PALETTE.length];
  colourCache.set(name, colour);
  return colour;
}

/** `#rrggbb` for a colour integer, for the DOM legend swatches. */
function cssColour(n) {
  return '#' + n.toString(16).padStart(6, '0');
}

// ---------------------------------------------------------------------------
// Scene
// ---------------------------------------------------------------------------

/** Elevation in metres to scene height, centred on the case and exaggerated. */
function sceneY(z) {
  return (z - centreZ) * VE;
}

/** The scene x of a column slot, so the row is centred on the origin. */
function colX(i) {
  return (i - (ROLES.length - 1) / 2) * COL_PITCH;
}

/**
 * A camera-facing text sprite at a scene position.
 *
 * The caller asks for a text height as a FRACTION OF THE VIEWPORT and
 * `sizeLabels` holds it there every frame: the vertical exaggeration runs from
 * 1 to 40, so a label sized in metres is either unreadable or fills the screen
 * at one end of that range.
 *
 * Parameters
 * ----------
 * text : string
 *     The label.
 * x, y, z : number
 *     Where it hangs, in scene coordinates.
 * colour : string
 *     The glyph colour.
 * frac : number
 *     Text height as a fraction of the viewport height.
 */
function label(text, x, y, z, colour, frac) {
  const font = 'bold 64px ui-sans-serif, system-ui, sans-serif';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const cv = document.createElement('canvas');
  cv.width = Math.max(Math.ceil(meas.measureText(text).width) + 24, 32);
  cv.height = 96;
  const ctx = cv.getContext('2d');
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Half these labels hang over pale sand and silt boxes and half over the dark
  // background, so the glyphs carry their own dark edge rather than relying on
  // whatever happens to be behind them.
  ctx.strokeStyle = 'rgba(6, 12, 24, 0.85)';
  ctx.lineWidth = 7;
  ctx.lineJoin = 'round';
  ctx.strokeText(text, cv.width / 2, cv.height / 2);
  ctx.fillStyle = colour;
  ctx.fillText(text, cv.width / 2, cv.height / 2);
  const tex = new THREE.CanvasTexture(cv);
  // The canvas is not power-of-two, so mipmapping would force a resize.
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false,
  }));
  sp.position.set(x, y, z);
  sp.userData.frac = frac || 0.02;
  sp.userData.aspect = cv.width / cv.height;
  labelSprites.push(sp);
  return sp;
}

/** Hold every label at its asked-for share of the viewport, whatever the zoom. */
function sizeLabels() {
  if (!labelSprites.length) return;
  const tanV = Math.tan(camera.fov * Math.PI / 360);
  for (const sp of labelSprites) {
    const d = camera.position.distanceTo(sp.position);
    const h = 2 * d * tanV * sp.userData.frac;
    sp.scale.set(h * sp.userData.aspect, h, 1);
  }
}

/** A line set from a flat [x,y,z,...] array of segment endpoints. */
function lineSegments(points, colour, opacity) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: colour, transparent: opacity < 1, opacity,
  }));
}

/** The 12 edges of a box, drawn just outside its faces so they do not z-fight. */
function boxEdges(geo, position, colour, opacity) {
  const seg = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: colour, transparent: opacity < 1, opacity }),
  );
  seg.position.copy(position);
  seg.scale.set(1.008, 1.002, 1.008);
  return seg;
}

/**
 * One interval as a solid box at its true elevations.
 *
 * A fragmented body's intervals are ringed in the alarm colour whatever the
 * outline toggle says: that ring is the whole reason the page exists, so it is
 * not something to switch off by accident.
 */
function intervalBox(group, x, interval, fragmented) {
  const h = Math.max((interval.top - interval.base) * VE, MIN_BOX_H);
  const geo = new THREE.BoxGeometry(COL_W, h, COL_D);
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    color: colourFor(interval),
  }));
  mesh.position.set(x, sceneY((interval.top + interval.base) / 2), 0);
  group.add(mesh);
  if (showOutlines) group.add(boxEdges(geo, mesh.position, OUTLINE_COLOUR, 0.55));
  if (fragmented) group.add(boxEdges(geo, mesh.position, FRAG_COLOUR, 1.0));
}

/** The elevation range a case spans, padded to something drawable. */
function caseExtent(c) {
  let lo = Infinity;
  let hi = -Infinity;
  for (const col of c.columns) {
    for (const iv of col.intervals) {
      lo = Math.min(lo, iv.base);
      hi = Math.max(hi, iv.top);
    }
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi) || hi - lo < 1e-6) {
    lo = Number.isFinite(lo) ? lo - 1 : -1;
    hi = Number.isFinite(hi) ? hi + 1 : 1;
  }
  return { lo, hi };
}

/** A round elevation step that puts roughly six guide lines across the range. */
function tickStep(span) {
  const steps = [0.25, 0.5, 1, 2, 2.5, 5, 10, 20, 25, 50, 100];
  for (const s of steps) if (span / s <= 7) return s;
  return 200;
}

/** The elevation axis at the left of the row, with guide lines behind the columns. */
function addAxis(group, lo, hi) {
  const step = tickStep(hi - lo);
  const first = Math.ceil(lo / step) * step;
  const xLeft = colX(0) - COL_W / 2 - 16;
  const xRight = colX(ROLES.length - 1) + COL_W / 2 + 6;
  const zBack = -COL_D * 0.72;
  const pts = [xLeft, sceneY(lo), zBack, xLeft, sceneY(hi), zBack];
  for (let z = first; z <= hi + 1e-9; z += step) {
    const y = sceneY(z);
    pts.push(xLeft, y, zBack, xRight, y, zBack);
    const text = (step < 1 ? z.toFixed(2) : z.toFixed(1)) + ' m';
    group.add(label(text, xLeft - 20, y, zBack, '#7d8ea6', 0.0135));
  }
  group.add(lineSegments(pts, GUIDE_COLOUR, 0.5));
  group.add(lineSegments(
    [xLeft, sceneY(lo), zBack, xLeft, sceneY(hi), zBack], AXIS_COLOUR, 0.85,
  ));
}

/** Plural-aware "N interval(s)". */
function intervalWord(n) {
  return n === 1 ? '1 interval' : n + ' intervals';
}

/** Rebuild the scene for the selected case. */
function build() {
  if (root) scene.remove(root);
  labelSprites = [];
  root = new THREE.Group();
  scene.add(root);
  if (!cases.length) return;

  const c = cases[sel];
  const { lo, hi } = caseExtent(c);
  centreZ = (lo + hi) / 2;
  addAxis(root, lo, hi);

  // The number the "1 interval -> 4" label counts up FROM. It is the payload's
  // own `worst_split`, not a count taken here, so the label in the scene and the
  // split in the picker are the same claim. On the real data these differ: the
  // body can be whole on one drawn section and already in pieces on the other,
  // and the payload names the whole one — each drawn column still shows its own
  // count beside it, so the asymmetry stays visible rather than being averaged.
  const worstId = c.worst ? c.worst.bodyId : null;
  const asDrawn = c.worst ? c.worst.asDrawn : 0;

  // Headroom for the column headings, in scene units, so they clear the boxes at
  // every exaggeration instead of sitting on them at 40 and in orbit at 1.
  const pad = Math.max((hi - lo) * VE * 0.05, 5);

  c.columns.forEach((col, i) => {
    const x = colX(i);
    const titleColour = col.role.drawn ? '#e2e8f0' : (col.key === 'today' ? '#7dd3fc' : '#c7d2fe');
    const topY = sceneY(hi);
    // Neighbouring headings are staggered: five titles across one row of columns
    // collide at any font size that is still readable. The EVEN columns take the
    // higher rung — lifting the odd ones instead puts them under the blurb.
    const lift = (i % 2) ? 0 : pad * 1.3;

    if (!col.present || !col.intervals.length) {
      root.add(label(col.role.title, x, topY + pad * 2.75 + lift, 0, '#64748b', 0.021));
      root.add(label(col.present ? 'no intervals in the payload' : 'absent from the payload',
        x, topY + pad * 2.1 + lift, 0, '#fca5a5', 0.016));
      return;
    }

    for (const iv of col.intervals) {
      intervalBox(root, x, iv, iv.bodyId !== null && c.fragIds.has(iv.bodyId));
    }

    // A frame around the two columns that were actually drawn by hand.
    if (col.role.drawn) {
      const h = Math.max((hi - lo) * VE, MIN_BOX_H);
      const frameGeo = new THREE.BoxGeometry(COL_W * 1.09, h * 1.01, COL_D * 1.09);
      const pos = new THREE.Vector3(x, sceneY((hi + lo) / 2), 0);
      root.add(boxEdges(frameGeo, pos, FRAME_COLOUR, 0.4));
    }

    root.add(label(col.role.title, x, topY + pad * 2.75 + lift, 0, titleColour, 0.021));
    const note = col.name ? col.role.note + ' · ' + col.name : col.role.note;
    root.add(label(note, x, topY + pad * 2.1 + lift, 0, '#8ea3bd', 0.0155));
    root.add(label(col.intervals.length + ' entries',
      x, topY + pad * 1.3, 0, '#cbd5e1', 0.017));

    // The fragmented body, counted in this column and set against how it was drawn.
    // The count sits in front of the column at the body's own middle; the same
    // stagger keeps it off its neighbour, because the body is at much the same
    // elevation in all five columns — which is the point being made.
    if (worstId) {
      const mine = col.intervals.filter((iv) => iv.bodyId === worstId);
      if (mine.length) {
        const midZ = (Math.max(...mine.map((iv) => iv.top))
          + Math.min(...mine.map((iv) => iv.base))) / 2;
        const text = (col.role.drawn || mine.length === asDrawn)
          ? intervalWord(mine.length)
          : intervalWord(asDrawn) + ' → ' + mine.length;
        const nudge = (i % 2) ? pad * 0.75 : -pad * 0.75;
        root.add(label(text, x, sceneY(midZ) + nudge, COL_D * 0.95, '#ff8fa8', 0.016));
      }
    }
  });
}

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------

/**
 * Frame the whole row, allowing for the HUD on top and the picker on the right.
 *
 * Every corner of what is drawn is measured against the camera's OWN right, up
 * and forward axes, and the distance is the one that brings the worst corner
 * inside both fields of view. Two simpler fits were tried and both failed on
 * this scene: a bounding sphere is tilt-proof but loose by the ratio of the
 * diagonal to the longest side, which left the row at half the size it could
 * be; fitting width and height separately against the two fields of view is
 * tight but assumes a head-on camera, and this one is tilted, so the columns
 * ran off the bottom of the frame.
 */
function fit() {
  if (!cases.length) return;
  const c = cases[sel];
  const { lo, hi } = caseExtent(c);
  const pad = Math.max((hi - lo) * VE * 0.05, 5);
  // The headings stand above the tallest box, so they are part of what is framed.
  const head = pad * 4.5;
  const halfW = ((ROLES.length - 1) * COL_PITCH + COL_W) / 2 + COL_W * 0.7;
  const yLo = sceneY(lo);
  const yHi = sceneY(hi) + head;
  const zBack = -COL_D * 0.9;
  const zFront = COL_D * 1.2;
  const middle = new THREE.Vector3(0, (yLo + yHi) / 2, (zBack + zFront) / 2);

  const dir = new THREE.Vector3(VIEW_DIR[0], VIEW_DIR[1], VIEW_DIR[2]).normalize();
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
  const up = new THREE.Vector3().crossVectors(dir, right).normalize();
  const tanV = Math.tan(camera.fov * Math.PI / 360);
  const tanH = tanV * camera.aspect;
  // Fit to the rectangle the panels leave, not to the whole canvas.
  const tanVFree = tanV * (1 - SAFE_TOP - SAFE_BOTTOM);
  const tanHFree = tanH * (1 - SAFE_LEFT - SAFE_RIGHT);

  let dist = 1;
  for (const sx of [-halfW, halfW]) {
    for (const sy of [yLo, yHi]) {
      for (const sz of [zBack, zFront]) {
        const v = new THREE.Vector3(sx, sy, sz).sub(middle);
        const along = v.dot(dir);
        dist = Math.max(dist,
          along + Math.abs(v.dot(right)) / tanHFree,
          along + Math.abs(v.dot(up)) / tanVFree);
      }
    }
  }
  dist *= 1.03;

  // Centre the drawing in that free rectangle rather than in the canvas. Moving
  // the target along the camera's own up axis pushes the drawing DOWN the
  // screen, and along its right axis pushes it LEFT; here the left reserve is
  // the larger one, so the shift comes out to the right, off the legend.
  const frameH = 2 * dist * tanV;
  const frameW = 2 * dist * tanH;
  const target = middle.clone()
    .add(right.clone().multiplyScalar((SAFE_RIGHT - SAFE_LEFT) / 2 * frameW))
    .add(up.clone().multiplyScalar((SAFE_TOP - SAFE_BOTTOM) / 2 * frameH));
  camera.position.copy(target).add(dir.clone().multiplyScalar(dist));
  camera.far = Math.max(dist * 6, 10000);
  camera.updateProjectionMatrix();
  controls.target.copy(target);
  controls.update();
}

// ---------------------------------------------------------------------------
// HUD, case list, legend
// ---------------------------------------------------------------------------

/** An integer coordinate grouped in threes, the way the debt entry writes them. */
function coord(v) {
  if (v === null) return '—';
  return Math.round(v).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

/** Append a span carrying a class and text, built as a node and set by textContent. */
function span(parent, cls, text) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = text;
  parent.appendChild(s);
  return s;
}

/** The three HUD lines for the selected case. */
function writeBlurb() {
  const c = cases[sel];
  const sub = document.getElementById('sub');
  sub.replaceChildren();
  const worstText = c.worst
    ? `${c.worstFormation || 'the body'} ${c.worstShort} is `
      + `${intervalWord(c.worst.asDrawn)} as drawn and ${c.worst.inBlend} in the blend`
    : 'no body in this case is split';
  span(sub, null, 'Between the two drawn sections the blend lays every ONE-SIDED unit at its own '
    + 'mid elevation. Where that mid falls inside a matched body, the matched body is laid out '
    + 'around it, in pieces — ');
  span(sub, 'frag', worstText);
  span(sub, null, '. TODAY is what ships; THIN and OUTSIDE are candidates, shown as they would '
    + 'be, endorsed by nobody.');
  if (c.fragDerived) {
    span(sub, null, ' (The payload marked no body, so the split was counted here from the '
      + 'columns themselves.)');
  }

  const mix = document.getElementById('mix');
  mix.replaceChildren();
  span(mix, null, 'at ');
  span(mix, 'b', `(${coord(c.x)}, ${coord(c.y)})`);
  if (c.w1 !== null) {
    span(mix, null, ' · mix ');
    span(mix, 'b', `w1 = ${c.w1.toFixed(3)}`);
    span(mix, null, ` (${Math.round(c.w1 * 100)} % / ${Math.round((c.w2 ?? (1 - c.w1)) * 100)} %)`);
  } else {
    span(mix, null, ' · mix w1 not in the payload');
  }
  const side = (info, which) => {
    span(mix, null, ' · ');
    span(mix, 'b', info.name || `section ${which}`);
    span(mix, null, info.dist !== null ? ` ${info.dist.toFixed(1)} m away` : ' (distance unknown)');
  };
  side(c.a, 'A');
  side(c.b, 'B');

  const counts = document.getElementById('counts');
  counts.replaceChildren();
  c.columns.forEach((col, i) => {
    if (i) span(counts, 'sep', '  |  ');
    const cls = col.role.drawn ? 'drawn' : (col.key === 'today' ? 'today' : 'cand');
    span(counts, cls, col.role.title.split(' —')[0].replace(' as drawn', ''));
    span(counts, null, ' ' + (col.present ? String(col.intervals.length) : '—'));
  });
  span(counts, null, '  entries');
  buildNotes();
}

/**
 * The payload's own remarks on the selected case, verbatim.
 *
 * These say what the boxes cannot: which units a candidate rule DELETES, where a
 * candidate still leaves a host split, and whether the model labels any ground
 * at this column at all. Cutting them would leave only the flattering half of
 * each candidate on screen.
 */
function buildNotes() {
  const list = document.getElementById('noteList');
  list.replaceChildren();
  const c = cases[sel];
  const hdr = document.getElementById('notesHdr');
  if (!c.notes.length) {
    hdr.style.display = 'none';
    return;
  }
  hdr.style.display = '';
  for (const note of c.notes) {
    const d = document.createElement('div');
    if (!c.inFootprint && /footprint/i.test(note)) d.className = 'warn';
    d.textContent = '· ' + note;
    list.appendChild(d);
  }
}

/**
 * The model-wide numbers, when the payload counted them.
 *
 * The debt entry's 33 columns came from a proxy check that over-reports, so what
 * the sweep actually found belongs on screen next to the case being looked at.
 */
function writeStats(raw) {
  const box = document.getElementById('stats');
  box.replaceChildren();
  if (!raw || typeof raw !== 'object') return;
  const n = (names) => num(pick(raw, names));
  const swept = n(['columnsSwept', 'columns_swept', 'sampled']);
  const blended = n(['columnsBlended', 'columns_blended']);
  const fragmenting = n(['columnsFragmenting', 'columns_fragmenting']);
  const bodies = n(['bodiesEverFragmented', 'bodies_ever_fragmented']);
  const worst = n(['worstSplit', 'worst_split']);
  const parts = [];
  if (fragmenting !== null && (blended ?? swept) !== null) {
    const base = blended ?? swept;
    parts.push([`${fragmenting.toLocaleString('en-GB')} of ${base.toLocaleString('en-GB')}`,
      ` between-section columns fragment a body (${(100 * fragmenting / base).toFixed(1)} %)`]);
  } else if (swept !== null) {
    parts.push([swept.toLocaleString('en-GB'), ' columns swept']);
  }
  if (bodies !== null) parts.push([String(bodies), ' bodies ever fragmented']);
  if (worst !== null) parts.push([String(worst), ' pieces at the worst']);
  if (!parts.length) return;
  span(box, null, 'model-wide: ');
  parts.forEach(([bold, rest], i) => {
    if (i) span(box, null, ' · ');
    span(box, 'b', bold);
    span(box, null, rest);
  });
}

/** The case picker: coordinates and worst split, worst first. */
function buildCaseList() {
  const list = document.getElementById('caseList');
  list.replaceChildren();
  cases.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'crow' + (i === sel ? ' on' : '');
    const form = document.createElement('span');
    form.className = 'cform';
    form.textContent = c.label || `${c.worstFormation || '—'} ${c.worstShort}`;
    const xy = document.createElement('span');
    xy.className = 'cxy';
    xy.textContent = `${coord(c.x)}, ${coord(c.y)}`;
    const split = document.createElement('span');
    split.className = 'csplit';
    split.textContent = c.worst ? `${c.worst.asDrawn} → ${c.worst.inBlend}` : '—';
    b.appendChild(form);
    b.appendChild(xy);
    b.appendChild(split);
    b.addEventListener('click', () => {
      sel = i;
      buildCaseList();
      writeBlurb();
      buildLegend();
      build();
      fit();
    });
    list.appendChild(b);
  });
}

/** The legend: the fixed rows, then every formation this case actually shows. */
function buildLegend() {
  const box = document.getElementById('legend');
  box.replaceChildren();
  const row = (parent) => {
    const d = document.createElement('div');
    parent.appendChild(d);
    return d;
  };
  const swatch = (parent, css, cls) => {
    const i = document.createElement('i');
    if (cls) i.className = cls;
    if (css) i.style.background = css;
    parent.appendChild(i);
  };

  const r1 = row(box);
  swatch(r1, null, 'ring');
  r1.appendChild(document.createTextNode('the body that fragments — outlined in every column'));
  const r2 = row(box);
  swatch(r2, null, 'frame');
  r2.appendChild(document.createTextNode('framed: the columns you drew, at the outside'));
  const r3 = row(box);
  r3.textContent = 'boxes are at true elevation; every column is the same point on the map';

  const c = cases[sel];
  const seen = new Map();
  for (const col of c.columns) {
    for (const iv of col.intervals) {
      const name = iv.formationName || iv.formationId || 'unnamed';
      if (!seen.has(name)) seen.set(name, colourFor(iv));
    }
  }
  const forms = document.createElement('div');
  forms.id = 'legendForms';
  box.appendChild(forms);
  for (const [name, colour] of seen) {
    const r = row(forms);
    swatch(r, cssColour(colour), null);
    r.appendChild(document.createTextNode(name));
  }
}

// ---------------------------------------------------------------------------
// Load
// ---------------------------------------------------------------------------

/** The payload shape this page reads, printed on screen when nothing loads. */
function readMissingSchemaText() {
  return [
    '{',
    '  "formationColours": { "<formation id or name>": "#c7b299" },',
    '  "cases": [{',
    '    "x": 88022.0, "y": 164359.0, "w1": 0.62,',
    '    "section_a": { "name": "...", "distance_m": 24.1 },',
    '    "section_b": { "name": "...", "distance_m": 41.6 },',
    '    "worst_split": { "body_id": "...", "on_section": 1, "in_blend": 4 },',
    '    "fragmented_bodies": ["..."],',
    '    "columns": {',
    '      "section_a": [ { "top": 12.838, "base": 9.743,',
    '                       "formation": "SILT", "body_id": "019ea170-..." } ],',
    '      "today": [ ... ], "thin": [ ... ], "outside": [ ... ], "section_b": [ ... ]',
    '    }',
    '  }]',
    '}',
    '',
    'top/base also read as top_elev/base_elev or z_top/z_base; columns also read as',
    'an array of { key, intervals } or as role keys on the case itself.',
  ].join('\n');
}

/** Show the blocking overlay, optionally with the schema block. */
function fail(msg, note, schema) {
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('errNote').textContent = note || '';
  document.getElementById('errSchema').textContent = schema || '';
  document.getElementById('err').style.display = 'grid';
}

/** Hide the blocking overlay once a usable payload has landed. */
function clearFail() {
  document.getElementById('err').style.display = 'none';
}

/**
 * Take a loaded payload, or say precisely why it cannot be used.
 *
 * A payload that parses but carries nothing drawable is the likeliest state
 * while the dump is still being written, so it gets its own message naming the
 * field that was missing rather than a blank scene.
 */
function ingest(d) {
  DATA = d;
  payloadColours = new Map();
  const rawColours = pick(d, ['formationColours', 'formation_colours', 'formation_colors', 'colours', 'colors']);
  if (rawColours && typeof rawColours === 'object') {
    for (const k of Object.keys(rawColours)) {
      const v = parseColour(rawColours[k]);
      if (v !== null) {
        payloadColours.set(k, v);
        payloadColours.set(k.toLowerCase(), v);
      }
    }
  }

  const rawCases = pick(d, ['cases', 'columns_cases', 'items']);
  if (!Array.isArray(rawCases) || !rawCases.length) {
    fail('fragment.json loaded, but it carries no cases.',
      'Expected a top-level "cases" array, one entry per fragmentation case.',
      readMissingSchemaText());
    return;
  }
  cases = rawCases.map(normaliseCase).filter((c) => c.columns.some((col) => col.intervals.length));
  if (!cases.length) {
    fail('fragment.json loaded, but no case carries a drawable column.',
      'Every interval needs a top and a base elevation; none was found.',
      readMissingSchemaText());
    return;
  }
  // Worst split first, so the headline case is the one that opens.
  cases.sort((a, b) => {
    const da = a.worst ? a.worst.inBlend - a.worst.asDrawn : -1;
    const db = b.worst ? b.worst.inBlend - b.worst.asDrawn : -1;
    return db - da;
  });
  sel = 0;
  colourCache = new Map();
  writeStats(pick(d, ['stats', 'summary', 'totals']));
  clearFail();
  buildCaseList();
  writeBlurb();
  buildLegend();
  build();
  fit();
}

/**
 * Fetch the payload, retrying quietly until it lands.
 *
 * The dump is written by a separate process, so an absent file is an expected
 * state rather than an error: the page says so, shows the shape it wants, and
 * keeps polling.
 */
function load(showRetryMessage) {
  fetch('fragment.json', { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then((d) => {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      ingest(d);
    })
    .catch((e) => {
      if (showRetryMessage) {
        fail('blend_viewer/fragment.json has not landed yet — ' + e.message,
          'The payload is written by the dump script. This page retries every 4 seconds, '
          + 'or press retry. If you opened this file directly, serve the folder instead: '
          + 'python -m http.server 8801 --bind 127.0.0.1',
          readMissingSchemaText());
      }
      if (!pollTimer) pollTimer = setInterval(() => load(false), 4000);
    });
}

/** Scene, camera, lights and the render loop. */
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.5, 100000);
  camera.position.set(60, 90, 420);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.55);
  keyLight.position.set(0.6, 1.4, 1.2);
  scene.add(keyLight);
  const backLight = new THREE.DirectionalLight(0x93c5fd, 0.3);
  backLight.position.set(-1, 0.4, -0.8);
  scene.add(backLight);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    sizeLabels();
    renderer.render(scene, camera);
  })();
}

if (typeof THREE === 'undefined') {
  fail('three.js did not load.',
    'The page pulls three.js r128 and OrbitControls from a CDN, so it needs a network '
    + 'connection the first time.', '');
} else {
  initScene();

  document.getElementById('ve').addEventListener('input', (e) => {
    VE = +e.target.value;
    document.getElementById('veLabel').textContent = String(VE);
    if (cases.length) { build(); fit(); }
  });
  document.getElementById('outlineBtn').addEventListener('click', (e) => {
    showOutlines = !showOutlines;
    e.target.classList.toggle('on', showOutlines);
    if (cases.length) build();
  });
  document.getElementById('fitBtn').addEventListener('click', () => { if (cases.length) fit(); });
  document.getElementById('retryBtn').addEventListener('click', () => load(true));

  load(true);
}
</script>
</body>
</html>
