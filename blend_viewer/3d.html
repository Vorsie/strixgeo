<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Four tests, one dying lens — what fills the space?</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --dim:#94a3b8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #hud { position:absolute; top:0; left:0; right:0; padding:13px 18px 26px; z-index:10;
    background:linear-gradient(180deg, rgba(15,23,42,.97) 55%, rgba(15,23,42,0));
    pointer-events:none; }
  h1 { font-size:16px; margin:0 0 3px; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; max-width:96ch; }
  .sub b { color:var(--ink); font-weight:600; }
  #rules { position:absolute; top:96px; left:18px; z-index:11; display:flex; gap:8px; }
  button { font:inherit; font-size:12.5px; padding:7px 13px; border-radius:7px; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button.on { background:#38bdf8; color:#06263a; border-color:#38bdf8; font-weight:600; }
  #note { position:absolute; top:142px; left:18px; z-index:11; width:42ch;
    background:rgba(30,41,59,.94); border:1px solid var(--line); border-radius:8px;
    padding:11px 14px; font-size:12.5px; color:var(--dim); }
  #note b { color:var(--ink); }
  #note .floor { margin-top:8px; font-variant-numeric:tabular-nums; }
  #legend { position:absolute; bottom:14px; left:18px; right:18px; z-index:11;
    font-size:12px; color:var(--dim); }
  #legend span { margin-right:16px; white-space:nowrap; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:-1px;
    margin-right:5px; border:1px solid rgba(0,0,0,.45); }
  .tag { position:absolute; z-index:9; transform:translate(-50%,-100%); pointer-events:none;
    font-size:11.5px; font-weight:600; color:#e2e8f0; background:rgba(15,23,42,.82);
    border:1px solid var(--line); border-radius:5px; padding:2px 7px; white-space:nowrap; }
  .tag.far { color:#94a3b8; }
  #err { position:absolute; inset:0; display:grid; place-items:center; padding:40px;
    text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div id="hud">
  <h1>Four tests, one dying lens — what fills the space it leaves?</h1>
  <div class="sub" id="sub">loading…</div>
</div>
<div id="rules"></div>
<div id="note"></div>
<div id="legend"></div>
<div id="err" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const COLOURS = {
  KLEI:'#7c8b5e', ZAND:'#e0a63c', SILT:'#b08d57', VEEN:'#5b4636',
  LEEM:'#c2a878', GRIND:'#9aa5b1', KEIEN:'#8b8b8b',
};
const FALLBACK = '#64748b';
const RULES = ['today', 'taper', 'hold', 'host'];
const LABEL = { today:'Today', taper:'A — taper', hold:'B — unknown', host:'C — host closes' };

// Each note is a list of runs; a two-item run is [text, 'b'] for emphasis.
const NOTES = {
  today: [
    ['Today.', 'b'],
    [' The lens thins toward the far pair of tests and nothing reserves the space it gives up. ' +
     'Because every column is stacked downward from the ground surface, each contact below the ' +
     'lens — and the bottom of the column — climbs by exactly what the lens lost.'],
  ],
  taper: [
    ['A — the lens reaches the far tests.', 'b'],
    [' Instead of running out halfway it thins the whole way, hitting zero at the back pair. It ' +
     'fills the space reserved for it, so nothing below it moves.'],
  ],
  hold: [
    ['B — dies halfway, rest unknown.', 'b'],
    [' The lens keeps the thickness it has today and still stops halfway between the two pairs. ' +
     'Past that the space is simply not modelled — nothing is invented, and nothing below moves.'],
  ],
  host: [
    ['C — dies halfway, neighbours close in.', 'b'],
    [' Same lens as today, dying in the same place; the units directly above and below grow into ' +
     'the space it leaves. Nothing else in the column moves.'],
  ],
};
const VEX = 2.0;   // vertical exaggeration

let scene, camera, renderer, controls, DATA, CE = 0;
const groups = {};
const tags = [];
let current = 'today';

const fail = (m) => {
  const e = document.getElementById('err');
  e.style.display = 'grid';
  e.textContent = m;
};
const colourFor = (n) => COLOURS[n] || FALLBACK;
const ey = (e) => (e - CE) * VEX;

/** Build a paragraph from [text, emphasis?] runs — no markup parsing. */
function runsToNode(runs, tag) {
  const p = document.createElement(tag || 'div');
  for (const [text, em] of runs) {
    if (em) {
      const b = document.createElement('b');
      b.textContent = text;
      p.appendChild(b);
    } else {
      p.appendChild(document.createTextNode(text));
    }
  }
  return p;
}

/**
 * One rule's whole patch: a stratigraphic panel at every sampled distance from the
 * section, built by following each body along the section within that panel.
 */
function panels(rule) {
  const grid = DATA.rules[rule];
  const nA = grid.length, nP = DATA.perpM.length;
  const byColour = new Map();          // colour -> triangle positions
  const lensPos = [];                  // the watched lens, drawn opaque on top
  const edges = [];                    // contact lines, for legibility
  const lensEdges = [];                // the watched lens outlined, so it is findable

  const quad = (arr, x0, x1, z, t0, t1, b0, b1) => {
    const A = [x0, ey(t0), z], B = [x1, ey(t1), z];
    const C = [x1, ey(b1), z], D = [x0, ey(b0), z];
    arr.push(...A, ...B, ...C, ...A, ...C, ...D);
  };
  const bucket = (colour) => {
    if (!byColour.has(colour)) byColour.set(colour, []);
    return byColour.get(colour);
  };

  for (let j = 0; j < nP; j++) {
    const z = DATA.perpM[j];
    // A body id is NOT one interval per column — the same body can occupy several
    // separate depths in a single stack. Keying on the id alone would join the
    // shallowest occurrence to the deepest one and draw a strip across the whole
    // column, so each occurrence is tracked as its own strand.
    const strands = new Map();
    for (let i = 0; i < nA; i++) {
      const seen = new Map();
      for (const u of grid[i][j]) {
        const nth = (seen.get(u.y) || 0) + 1;
        seen.set(u.y, nth);
        const key = `${u.y}#${nth}`;
        if (!strands.has(key)) strands.set(key, { body: u.y, pts: [] });
        strands.get(key).pts.push({ i, ...u });
      }
    }
    for (const { body, pts } of strands.values()) {
      const target = body === DATA.lensBody ? lensPos : null;
      for (let k = 0; k < pts.length - 1; k++) {
        const p = pts[k], q = pts[k + 1];
        // Break the strand across a sample gap, a formation change, or a jump so
        // large the two intervals no longer overlap at all.
        if (q.i !== p.i + 1 || q.f !== p.f || p.b >= q.t || q.b >= p.t) continue;
        const x0 = DATA.alongM[p.i], x1 = DATA.alongM[q.i];
        quad(target || bucket(colourFor(p.f)), x0, x1, z, p.t, q.t, p.b, q.b);
        const into = target ? lensEdges : edges;
        into.push(x0, ey(p.t), z, x1, ey(q.t), z);
        into.push(x0, ey(p.b), z, x1, ey(q.b), z);
      }
    }
  }

  const g = new THREE.Group();
  const mesh = (pos, colour) => {
    if (!pos.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: colour, side: THREE.DoubleSide,
    })));
  };
  for (const [colour, pos] of byColour) mesh(pos, colour);
  mesh(lensPos, colourFor(DATA.lensFormation));

  const lines = (pos, colour, opacity) => {
    if (!pos.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
      color: colour, transparent: opacity < 1, opacity,
    })));
  };
  lines(edges, 0x0b1220, 0.5);
  lines(lensEdges, 0xffffff, 1);
  return g;
}

/**
 * A test, drawn as a slim stack of boxes plus a floating name tag.
 *
 * The near pair gets a tag only. Their columns sit inside the front slice — that
 * slice IS the fill band between them — so drawing boxes there would bury them in
 * the panel and hide the very geometry they define.
 */
function testColumn(t) {
  const g = new THREE.Group();
  for (const u of t.side === 'near' ? [] : t.units) {
    const h = Math.max((u.t - u.b) * VEX, 0.05);
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(2.4, h, 2.4),
      new THREE.MeshLambertMaterial({ color: colourFor(u.f) }),
    );
    box.position.set(t.x, ey((u.t + u.b) / 2), t.z);
    g.add(box);
  }
  const tag = document.createElement('div');
  tag.className = t.side === 'far' ? 'tag far' : 'tag';
  tag.textContent = t.name;
  document.body.appendChild(tag);
  const topEl = t.units.length ? Math.max(...t.units.map((u) => u.t)) : 0;
  tags.push({ el: tag, v: new THREE.Vector3(t.x, ey(topEl) + 3, t.z) });
  return g;
}

/**
 * The trace of one section, drawn through its two tests and extended past them.
 *
 * The two sections are not parallel, so the four tests do not bound a neat
 * rectangle — the back edge of the patch meets the far section somewhere between
 * its two tests rather than opposite the near pair. Drawing the traces makes that
 * visible instead of leaving the far tests looking misplaced.
 */
function trace(a, b, colour, elev) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const len = Math.hypot(dx, dz) || 1;
  const ext = 18 / len;
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(a.x - dx * ext, elev, a.z - dz * ext),
    new THREE.Vector3(b.x + dx * ext, elev, b.z + dz * ext),
  ]);
  return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: colour }));
}

/** The halfway plane: where a lens between the two pairs of tests is made to die. */
function midline(height) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(DATA.gapLengthM * 1.15, height),
    new THREE.MeshBasicMaterial({
      color: 0x38bdf8, transparent: true, opacity: 0.07, side: THREE.DoubleSide,
    }),
  );
  m.position.set(DATA.gapLengthM / 2, 0, DATA.reachM / 2);
  return m;
}

function select(rule) {
  current = rule;
  for (const r of RULES) groups[r].visible = r === rule;
  const bases = [];
  for (const row of DATA.rules[rule]) {
    for (const col of row) if (col.length) bases.push(Math.min(...col.map((u) => u.b)));
  }
  const lo = Math.min(...bases), hi = Math.max(...bases);
  const floor = document.createElement('div');
  floor.className = 'floor';
  floor.textContent = `bottom of the column across the patch: ${lo.toFixed(2)} .. ${hi.toFixed(2)} m`;
  floor.style.color = hi - lo > 1.5 ? '#f87171' : '#4ade80';
  const note = document.getElementById('note');
  note.replaceChildren(runsToNode(NOTES[rule]), floor);
  for (const b of document.querySelectorAll('#rules button')) {
    b.className = b.dataset.rule === rule ? 'on' : '';
  }
}

fetch('model3d.json').then((r) => r.json()).then((d) => {
  DATA = d;
  if (typeof THREE === 'undefined') { fail('three.js did not load (offline?).'); return; }

  const elevs = [];
  for (const row of d.rules.today) for (const col of row) for (const u of col) elevs.push(u.t, u.b);
  const eLo = Math.min(...elevs), eHi = Math.max(...elevs);
  CE = (eLo + eHi) / 2;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 6000);
  camera.position.set(-d.gapLengthM * 0.55, 68, d.reachM * 1.75);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(d.gapLengthM / 2, 0, d.reachM / 2);

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.5);
  sun.position.set(1, 2, 1.5);
  scene.add(sun);

  for (const rule of RULES) {
    const g = panels(rule);
    g.visible = rule === current;
    groups[rule] = g;
    scene.add(g);
  }
  scene.add(midline((eHi - eLo) * VEX * 1.4));
  for (const t of d.tests) scene.add(testColumn(t));
  const nearPair = d.tests.filter((t) => t.side === 'near');
  const farPair = d.tests.filter((t) => t.side === 'far');
  const traceY = ey(eHi) + 1.5;
  scene.add(trace(nearPair[0], nearPair[1], 0x38bdf8, traceY));
  scene.add(trace(farPair[0], farPair[1], 0x94a3b8, traceY));

  const bar = document.getElementById('rules');
  for (const rule of RULES) {
    const b = document.createElement('button');
    b.dataset.rule = rule;
    b.textContent = LABEL[rule];
    b.addEventListener('click', () => select(rule));
    bar.appendChild(b);
  }
  select('today');

  const near = d.tests.filter((t) => t.side === 'near').map((t) => t.name).join(' – ');
  const far = d.tests.filter((t) => t.side === 'far').map((t) => t.name).join(' – ');
  document.getElementById('sub').replaceChildren(runsToNode([
    ['Front pair '], [near, 'b'],
    [`, ${d.gapLengthM.toFixed(0)} m apart on the section you drew (blue trace). Back pair `],
    [far, 'b'],
    [`, on the next section ${d.reachM.toFixed(0)} m away (grey trace) — it runs obliquely, so ` +
     'the four tests do not form a rectangle. The body being watched is '],
    [d.lensFormation, 'b'],
    [': present at the front pair, absent at the back, so it has to die somewhere across this ' +
     'patch — the pale blue plane is halfway. Every slice is a full cross-section; the front ' +
     `slice is your own fill band. Elevation ×${VEX}. Drag to orbit, scroll to zoom.`],
  ]));

  const seen = new Set();
  for (const row of d.rules.today) for (const col of row) for (const u of col) seen.add(u.f);
  const legend = document.getElementById('legend');
  legend.replaceChildren();
  const outlined = document.createElement('span');
  const outlineSw = document.createElement('i');
  outlineSw.className = 'sw';
  outlineSw.style.background = 'transparent';
  outlineSw.style.borderColor = '#fff';
  outlined.append(outlineSw, document.createTextNode('white outline = the body being watched'));
  legend.appendChild(outlined);
  for (const n of [...seen].sort()) {
    const s = document.createElement('span');
    const sw = document.createElement('i');
    sw.className = 'sw';
    sw.style.background = colourFor(n);
    s.append(sw, document.createTextNode(n));
    legend.appendChild(s);
  }

  const v = new THREE.Vector3();
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
    for (const t of tags) {
      v.copy(t.v).project(camera);
      const on = v.z < 1;
      t.el.style.display = on ? 'block' : 'none';
      if (on) {
        t.el.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
        t.el.style.top = `${(-v.y * 0.5 + 0.5) * innerHeight}px`;
      }
    }
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}).catch((e) => fail('Could not load model3d.json — run: uv run python scripts/dump_blend_3d.py  (' + e + ')'));
</script>
</body>
</html>
