<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The lens in 3-D — what fills the space it vacates?</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --dim:#94a3b8; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #hud { position:absolute; top:0; left:0; right:0; padding:14px 18px; z-index:10;
    background:linear-gradient(180deg, rgba(15,23,42,.96), rgba(15,23,42,0)); pointer-events:none; }
  h1 { font-size:16px; margin:0 0 2px; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; max-width:78ch; }
  #rules { position:absolute; top:112px; left:18px; z-index:11; display:flex; gap:8px; }
  button { font:inherit; font-size:12.5px; padding:7px 13px; border-radius:7px; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button.on { background:#38bdf8; color:#06263a; border-color:#38bdf8; font-weight:600; }
  #note { position:absolute; top:158px; left:18px; z-index:11; max-width:44ch;
    background:rgba(30,41,59,.92); border:1px solid var(--line); border-radius:8px;
    padding:10px 13px; font-size:12.5px; color:var(--dim); }
  #note strong { color:var(--ink); }
  #legend { position:absolute; bottom:14px; left:18px; z-index:11; font-size:12px; color:var(--dim); }
  #legend span { margin-right:16px; }
  .sw { display:inline-block; width:11px; height:11px; border-radius:2px; vertical-align:-1px;
    margin-right:5px; border:1px solid rgba(0,0,0,.4); }
  #err { position:absolute; inset:0; display:grid; place-items:center; padding:40px;
    text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div id="hud">
  <h1>The lens between two tests, and the floor under it</h1>
  <div class="sub" id="sub">loading…</div>
</div>
<div id="rules"></div>
<div id="note"></div>
<div id="legend">
  <span><i class="sw" style="background:#e0a63c"></i>the lens</span>
  <span><i class="sw" style="background:#7c8b5e"></i>the floor beneath the column</span>
  <span><i class="sw" style="background:#38bdf8"></i>the two test columns</span>
</div>
<div id="err" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const NOTES = {
  today: 'Today. The lens gives up thickness and nothing reserves the space, so the FLOOR under it rides up. Watch the green surface bulge upward where the lens is thickest.',
  taper: 'A — the lens tapers to the far section. It thins linearly and reaches zero at the neighbouring section rather than halfway. The floor stays put.',
  hold: 'B — dies at the midline, rest unknown. The lens keeps today’s thickness and still dies halfway; the space it stops filling is simply not modelled. The floor stays put.',
  host: 'C — dies at the midline, host closes over. Same lens as today; the units above and below grow into the space it leaves. The floor stays put.',
};
const RULES = ['today', 'taper', 'hold', 'host'];
const LABEL = { today: 'Today', taper: 'A — taper', hold: 'B — unknown', host: 'C — host closes' };

let scene, camera, renderer, controls, DATA;
const groups = {};
let current = 'today';
let VEX = 2.2;   // vertical exaggeration
let SX = 1, SZ = 1, CZ = 0, CX = 0, CE = 0;

function fail(msg) {
  const e = document.getElementById('err');
  e.style.display = 'grid';
  e.textContent = msg;
}

/** Triangles over a grid, skipping any quad with a missing corner. */
function surface(grid, colour, opacity) {
  const pos = [];
  const nA = grid.length, nP = grid[0].length;
  for (let i = 0; i < nA - 1; i++) {
    for (let j = 0; j < nP - 1; j++) {
      const a = grid[i][j], b = grid[i + 1][j], c = grid[i + 1][j + 1], d = grid[i][j + 1];
      if (a === null || b === null || c === null || d === null) continue;
      const xi = (DATA.alongFractions[i] * DATA.gapLengthM - CX) * SX;
      const xi1 = (DATA.alongFractions[i + 1] * DATA.gapLengthM - CX) * SX;
      const zj = (DATA.perpM[j] - CZ) * SZ;
      const zj1 = (DATA.perpM[j + 1] - CZ) * SZ;
      const A = [xi, (a - CE) * VEX, zj], B = [xi1, (b - CE) * VEX, zj];
      const C = [xi1, (c - CE) * VEX, zj1], D = [xi, (d - CE) * VEX, zj1];
      pos.push(...A, ...B, ...C, ...A, ...C, ...D);
    }
  }
  if (!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({
    color: colour, side: THREE.DoubleSide, transparent: opacity < 1, opacity,
  }));
}

/** The vertical skirt joining a lens's top and base at the edge of its extent. */
function skirt(top, base, colour) {
  const pos = [];
  const nA = top.length, nP = top[0].length;
  const at = (i, j) => [
    (DATA.alongFractions[i] * DATA.gapLengthM - CX) * SX,
    (DATA.perpM[j] - CZ) * SZ,
  ];
  for (let i = 0; i < nA; i++) {
    for (let j = 0; j < nP; j++) {
      if (top[i][j] === null) continue;
      for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ni = i + di, nj = j + dj;
        const outside = ni < 0 || nj < 0 || ni >= nA || nj >= nP || top[ni][nj] === null;
        if (!outside) continue;
        const [x, z] = at(i, j);
        const t = (top[i][j] - CE) * VEX, b = (base[i][j] - CE) * VEX;
        const e = 0.35;
        const [ox, oz] = [x + (dj ? 0 : di * e), z + (dj ? dj * e : 0)];
        pos.push(x, t, z, x, b, z, ox, b, oz, x, t, z, ox, b, oz, ox, t, oz);
      }
    }
  }
  if (!pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshLambertMaterial({ color: colour, side: THREE.DoubleSide }));
}

/** A test column drawn as a stack of thin boxes at one end of the gap. */
function column(units, alongM) {
  const grp = new THREE.Group();
  for (const u of units) {
    const h = Math.max((u.top - u.base) * VEX, 0.05);
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.6, h, 1.6),
      new THREE.MeshLambertMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55 }),
    );
    box.position.set((alongM - CX) * SX, ((u.top + u.base) / 2 - CE) * VEX, (0 - CZ) * SZ);
    grp.add(box);
  }
  return grp;
}

function build() {
  for (const rule of RULES) {
    const g = new THREE.Group();
    const r = DATA.rules[rule];
    const floor = surface(r.floor, 0x7c8b5e, 1);
    if (floor) g.add(floor);
    const lensTop = surface(r.lensTop, 0xe0a63c, 1);
    const lensBase = surface(r.lensBase, 0xc98c22, 1);
    if (lensTop) g.add(lensTop);
    if (lensBase) g.add(lensBase);
    const sk = skirt(r.lensTop, r.lensBase, 0xe0a63c);
    if (sk) g.add(sk);
    g.visible = rule === current;
    groups[rule] = g;
    scene.add(g);
  }
  scene.add(column(DATA.leftColumn, 0));
  scene.add(column(DATA.rightColumn, DATA.gapLengthM));
}

function select(rule) {
  current = rule;
  for (const r of RULES) groups[r].visible = r === rule;
  document.getElementById('note').textContent = NOTES[rule];
  for (const b of document.querySelectorAll('#rules button')) {
    b.className = b.dataset.rule === rule ? 'on' : '';
  }
}

fetch('model3d.json').then((r) => r.json()).then((d) => {
  DATA = d;
  if (typeof THREE === 'undefined') { fail('three.js did not load (offline?).'); return; }

  const elevs = [];
  for (const rule of RULES) {
    for (const key of ['lensTop', 'lensBase', 'floor']) {
      for (const row of d.rules[rule][key]) for (const v of row) if (v !== null) elevs.push(v);
    }
  }
  CX = d.gapLengthM / 2; CZ = d.reachM / 2;
  CE = (Math.min(...elevs) + Math.max(...elevs)) / 2;

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 5000);
  camera.position.set(d.gapLengthM * 0.75, 26, d.reachM * 1.7);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(1, 2, 1);
  scene.add(sun);
  const sun2 = new THREE.DirectionalLight(0xffffff, 0.3);
  sun2.position.set(-1, -0.4, -1);
  scene.add(sun2);

  build();

  const bar = document.getElementById('rules');
  for (const rule of RULES) {
    const b = document.createElement('button');
    b.dataset.rule = rule;
    b.textContent = LABEL[rule];
    b.addEventListener('click', () => select(rule));
    bar.appendChild(b);
  }
  select('today');

  document.getElementById('sub').textContent =
    `${d.gap} — ${d.gapLengthM.toFixed(0)} m of section, running ${d.reachM.toFixed(0)} m back ` +
    `toward ${d.towards}. The blue columns are the two tests; the section line is the near edge. ` +
    `The gold body is the ${d.lensFormation} lens, present on this section and absent on the ` +
    `neighbour, so it must die somewhere in between. The green surface is the floor of the ` +
    `column. Vertical exaggeration ${VEX}x. Drag to orbit, scroll to zoom.`;

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}).catch((e) => fail('Could not load model3d.json — run: uv run python scripts/dump_blend_3d.py  (' + e + ')'));
</script>
</body>
</html>
