<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The silt, the ties that carry it, and the tie that does not</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --dim:#94a3b8;
          --carry:#4ade80; --clear:#fbbf24; --cross:#c084fc; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  #hud { position:absolute; top:0; left:0; right:0; padding:13px 18px 30px; z-index:10;
    background:linear-gradient(180deg, rgba(15,23,42,.97) 58%, rgba(15,23,42,0));
    pointer-events:none; }
  h1 { font-size:16px; margin:0 0 3px; font-weight:600; }
  .sub { color:var(--dim); font-size:12.5px; max-width:104ch; }
  .sub b { color:var(--ink); font-weight:600; }
  .sub .cross { color:var(--cross); font-weight:600; }
  .sub .ok { color:var(--clear); font-weight:600; }
  #controls { position:absolute; top:104px; left:18px; z-index:11; display:flex; gap:8px;
    flex-wrap:wrap; align-items:center; max-width:60vw; }
  button { font:inherit; font-size:12.5px; padding:7px 12px; border-radius:7px; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button.on { background:#38bdf8; color:#06263a; border-color:#38bdf8; font-weight:600; }
  button:hover { border-color:#5b7characters; }
  .grp { display:flex; gap:6px; align-items:center; background:rgba(30,41,59,.72);
    border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px;
    color:var(--dim); }
  input[type=range] { width:120px; }
  #legend { position:absolute; left:18px; bottom:16px; z-index:11; font-size:12px;
    color:var(--dim); background:rgba(11,18,32,.86); padding:9px 13px; border-radius:8px;
    border:1px solid var(--line); }
  #legend div { margin:2px 0; }
  #legend i { display:inline-block; width:14px; height:10px; vertical-align:0;
    margin-right:8px; border-radius:2px; }
  #hint { position:absolute; right:18px; bottom:16px; z-index:11; font-size:11.5px;
    color:var(--dim); }
  #err { position:absolute; inset:0; display:none; place-items:center; z-index:20;
    background:rgba(15,23,42,.94); font-size:14px; color:#fca5a5; text-align:center;
    padding:40px; }
  canvas { display:block; }
</style>
</head>
<body>
<div id="hud">
  <h1>The silt, the ties that carry it, and the tie that does not</h1>
  <div class="sub" id="sub">loading…</div>
</div>
<div id="controls">
  <div class="grp" id="cases"></div>
  <div class="grp">
    vertical&nbsp;×<span id="veLabel">8</span>
    <input type="range" id="ve" min="1" max="30" step="1" value="8" />
  </div>
  <button id="ctxBtn" class="on">surrounding layers</button>
  <button id="fenceBtn" class="on">section planes</button>
  <button id="fitBtn">recentre</button>
</div>
<div id="legend">
  <div><i style="background:#fb923c"></i>this SILT body, as drawn on each section</div>
  <div><i style="background:#4ade80;opacity:.5"></i>tie that carries it</div>
  <div><i style="background:#fbbf24;opacity:.5"></i>absent — runs clear of the body</div>
  <div><i style="background:#c084fc;opacity:.6"></i>absent — and crosses the body's ground</div>
  <div><i style="background:#64748b;opacity:.45"></i>surrounding layers</div>
</div>
<div id="hint">drag to orbit · wheel to zoom · right-drag to pan</div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
let DATA = null, sel = 0, VE = 8;
let scene, camera, renderer, controls, root;
let showContext = true, showFences = true;
let centre = { x: 0, y: 0, z: 0 };

const FORMATION_COLOUR = {
  ZAND: 0xf5d78e, SILT: 0xc7b299, KLEI: 0x8fa9b8, VEEN: 0x8a6f4e, LEEM: 0xbfae8f,
};
const BODY_COLOUR = 0xfb923c;

const fail = (msg) => {
  const e = document.getElementById('err');
  e.textContent = msg;
  e.style.display = 'grid';
};

/** World (easting, northing, elevation) into the y-up scene, centred and exaggerated. */
function toScene(x, y, z) {
  return [x - centre.x, (z - centre.z) * VE, -(y - centre.y)];
}

function meshFromTris(tris, colour, opacity, depthWrite) {
  if (!tris.length) return null;
  const pos = new Float32Array(tris.length * 3);
  for (let i = 0; i < tris.length; i++) {
    const [x, y, z] = toScene(tris[i][0], tris[i][1], tris[i][2]);
    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({
    color: colour, transparent: opacity < 1, opacity,
    side: THREE.DoubleSide, depthWrite,
  });
  return new THREE.Mesh(geo, mat);
}

/** A section drawn as a standing plane over its full column run and depth range. */
function fenceMesh(fence, zLo, zHi, colour, opacity) {
  const tris = [];
  for (let i = 0; i < fence.length - 1; i++) {
    const [x0, y0] = fence[i], [x1, y1] = fence[i + 1];
    tris.push([x0, y0, zLo], [x1, y1, zLo], [x1, y1, zHi]);
    tris.push([x0, y0, zLo], [x1, y1, zHi], [x0, y0, zHi]);
  }
  return meshFromTris(tris, colour, opacity, false);
}

function label(text, x, y, z, colour) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 96;
  const ctx = cv.getContext('2d');
  ctx.font = 'bold 46px ui-sans-serif, system-ui, sans-serif';
  ctx.fillStyle = colour;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 48);
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true,
    depthTest: false }));
  const [sx, sy, sz] = toScene(x, y, z);
  sp.position.set(sx, sy, sz);
  sp.scale.set(90, 17, 1);
  return sp;
}

function build() {
  if (root) scene.remove(root);
  root = new THREE.Group();
  scene.add(root);

  const c = DATA.cases[sel];
  let zLo = Infinity, zHi = -Infinity;
  for (const p of c.panels) {
    for (const t of p.body_tris) { zLo = Math.min(zLo, t[2]); zHi = Math.max(zHi, t[2]); }
    for (const tris of Object.values(p.context)) {
      for (const t of tris) { zLo = Math.min(zLo, t[2]); zHi = Math.max(zHi, t[2]); }
    }
  }
  if (!isFinite(zLo)) { zLo = 0; zHi = 1; }

  for (const p of c.panels) {
    if (showContext) {
      for (const [formation, tris] of Object.entries(p.context)) {
        const key = formation.toUpperCase().split(/[^A-Z]/)[0];
        const m = meshFromTris(tris, FORMATION_COLOUR[key] ?? 0x64748b, 0.16, false);
        if (m) root.add(m);
      }
    }
    const body = meshFromTris(p.body_tris, BODY_COLOUR, 1.0, true);
    if (body) root.add(body);

    if (showFences) {
      let colour = 0x475569, op = 0.07;
      if (p.absent_between) {
        colour = p.crosses ? 0xc084fc : 0xfbbf24;
        op = p.crosses ? 0.3 : 0.16;
      } else if (p.carries) { colour = 0x4ade80; op = 0.1; }
      const f = fenceMesh(p.fence, zLo - 1, zHi + 1, colour, op);
      if (f) root.add(f);
    }

    // Name every tie that matters, coloured by what it is.
    const mid = p.fence[Math.floor(p.fence.length / 2)];
    let lc = '#94a3b8';
    if (p.absent_between) lc = p.crosses ? '#e9d5ff' : '#fde68a';
    else if (p.carries) lc = '#bbf7d0';
    root.add(label(p.name, mid[0], mid[1], zHi + 3, lc));
  }

  const real = c.absences.filter((a) => a.crosses);
  const clear = c.absences.filter((a) => !a.crosses);
  const sub = document.getElementById('sub');
  sub.replaceChildren();
  const add = (cls, text) => {
    const s = document.createElement(cls ? 'span' : 'span');
    if (cls) s.className = cls;
    s.textContent = text;
    sub.appendChild(s);
  };
  add(null, `${c.short} ${c.formation} — carried by ${c.carrying_ties.length} ties, up to `);
  add(null, `${c.max_th_on_ties.toFixed(2)} m thick. `);
  if (real.length) {
    add('cross', `${real.map((a) => a.name).join(', ')} crosses its ground without carrying it`);
    add(null, ' — real evidence of a hole. ');
  }
  if (clear.length) {
    add('ok', `${clear.map((a) => a.name).join(', ')} `);
    add(null, `${clear.length === 1 ? 'is' : 'are'} absent but ` +
      `${clear.length === 1 ? 'runs' : 'run'} ` +
      `${clear.map((a) => a.gap_m + ' m').join(' / ')} clear of it, so ` +
      `${clear.length === 1 ? 'it says' : 'they say'} nothing.`);
  }
}

function fit() {
  const c = DATA.cases[sel];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of c.panels) for (const [x, y] of p.fence) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  const span = Math.max(x1 - x0, y1 - y0, 50);
  camera.position.set(span * 0.55, span * 0.42, span * 0.75);
  controls.target.set(0, 0, 0);
  controls.update();
}

function caseButtons() {
  const box = document.getElementById('cases');
  box.replaceChildren();
  DATA.cases.forEach((c, i) => {
    const b = document.createElement('button');
    const real = c.absences.filter((a) => a.crosses).length;
    b.textContent = `${c.short} ${real ? '· 1 real' : '· dissolves'}`;
    b.className = i === sel ? 'on' : '';
    b.onclick = () => { sel = i; caseButtons(); build(); fit(); };
    box.appendChild(b);
  });
}

fetch('sandwich.json').then((r) => r.json()).then((d) => {
  DATA = d;
  if (typeof THREE === 'undefined') { fail('three.js did not load (offline?).'); return; }

  // Centre on the case geometry: Lambert coordinates are ~90 000 and eat float precision.
  let n = 0, sx = 0, sy = 0, sz = 0;
  for (const c of d.cases) for (const p of c.panels) for (const [x, y] of p.fence) {
    sx += x; sy += y; n++;
  }
  for (const c of d.cases) for (const p of c.panels) for (const t of p.body_tris) { sz += t[2]; }
  const nz = d.cases.reduce((a, c) => a + c.panels.reduce((b, p) => b + p.body_tris.length, 0), 0);
  centre = { x: sx / Math.max(n, 1), y: sy / Math.max(n, 1), z: sz / Math.max(nz, 1) };

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 100000);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const key = new THREE.DirectionalLight(0xffffff, 0.6);
  key.position.set(1, 2, 1);
  scene.add(key);
  const back = new THREE.DirectionalLight(0x93c5fd, 0.28);
  back.position.set(-1, 0.4, -1);
  scene.add(back);

  caseButtons();
  build();
  fit();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  document.getElementById('ve').addEventListener('input', (e) => {
    VE = +e.target.value;
    document.getElementById('veLabel').textContent = String(VE);
    build();
  });
  document.getElementById('ctxBtn').addEventListener('click', (e) => {
    showContext = !showContext;
    e.target.classList.toggle('on', showContext);
    build();
  });
  document.getElementById('fenceBtn').addEventListener('click', (e) => {
    showFences = !showFences;
    e.target.classList.toggle('on', showFences);
    build();
  });
  document.getElementById('fitBtn').addEventListener('click', fit);

  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
}).catch((e) => fail('could not load sandwich.json — ' + e));
</script>
</body>
</html>
