<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lens outlines in plan view — which rule?</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --line:#334155; --ink:#e2e8f0; --dim:#94a3b8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #wrap { display:flex; height:100%; }
  #side { width:330px; flex:none; border-right:1px solid var(--line); display:flex;
    flex-direction:column; background:#0d1626; }
  #side h1 { font-size:15px; margin:0; padding:14px 16px 6px; font-weight:600; }
  #side .blurb { font-size:12px; color:var(--dim); padding:0 16px 12px; }
  #side .blurb b { color:var(--ink); }
  #rules { display:flex; gap:6px; padding:0 16px 10px; flex-wrap:wrap; }
  button { font:inherit; font-size:12px; padding:6px 11px; border-radius:6px; cursor:pointer;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); }
  button.on { background:#38bdf8; color:#06263a; border-color:#38bdf8; font-weight:600; }
  #gapRow { padding:0 16px 10px; font-size:12px; color:var(--dim);
    display:flex; align-items:center; gap:9px; }
  #gapRow input { flex:1; accent-color:#38bdf8; }
  #note { margin:0 16px 12px; background:var(--panel); border:1px solid var(--line);
    border-radius:7px; padding:9px 12px; font-size:12px; color:var(--dim); }
  #note b { color:var(--ink); }
  #listHead { padding:2px 16px 6px; font-size:11px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.05em; }
  #list { flex:1; overflow-y:auto; padding:0 10px 14px; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
    cursor:pointer; font-size:12.5px; }
  .row:hover { background:#16233b; }
  .row.sel { background:#1d3557; }
  .row .sw { width:11px; height:11px; border-radius:2px; flex:none;
    border:1px solid rgba(0,0,0,.45); }
  .row .n { color:var(--dim); margin-left:auto; font-variant-numeric:tabular-nums;
    font-size:11.5px; white-space:nowrap; }
  #stage { flex:1; position:relative; }
  svg { width:100%; height:100%; display:block; background:#0b1220; }
  #hint { position:absolute; left:16px; bottom:14px; font-size:12px; color:var(--dim); }
  #hint span { margin-right:16px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h1>Lens outlines, in plan view</h1>
    <div class="blurb" id="blurb">loading…</div>
    <div id="rules"></div>
    <div id="gapRow">
      <label for="gap">group within</label>
      <input type="range" id="gap" min="20" max="400" step="10" value="120" />
      <span id="gapVal">120 m</span>
    </div>
    <div id="note"></div>
    <div id="listHead">bodies — most pinch points first</div>
    <div id="list"></div>
  </div>
  <div id="stage">
    <svg id="map"></svg>
    <div id="hint">
      <span>drag to pan</span><span>scroll to zoom</span>
      <span>thick line = where the body actually is</span>
      <span>filled shape = the outline rule</span>
    </div>
  </div>
</div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOURS = {
  KLEI:'#7c8b5e', ZAND:'#e0a63c', SILT:'#b08d57', VEEN:'#5b4636',
  LEEM:'#c2a878', GRIND:'#9aa5b1', KEIEN:'#8b8b8b',
};
const FALLBACK = '#64748b';
const RULES = ['clusters', 'hull', 'angular'];
const LABEL = { clusters:'One per termination', hull:'One hull', angular:'Angular order' };
const NOTES = {
  clusters: [
    ['One outline per termination.', 'b'],
    [' Pinch points are grouped by proximity and each group gets its own outline, so a ' +
     'body that dies out in several separate places carries several lenses rather than one ' +
     'blob. The slider sets how close points must be to count as the same termination.'],
  ],
  hull: [
    ['One hull for the whole body.', 'b'],
    [' Every pinch point of the body goes into a single convex outline. Simple and always ' +
     'valid, but where a body terminates in more than one place the hull spans the ground ' +
     'in between — ground where the body actually continues.'],
  ],
  angular: [
    ['Angular order about the centroid.', 'b'],
    [' The points are joined in the order they sweep around their middle, so the outline can ' +
     'be concave. On a scattered set the ring can cross itself, which is what to look for here.'],
  ],
};

let DATA = null, rule = 'clusters', selected = null, gapM = 120;
let view = { x: 0, y: 0, k: 1 };

const colourFor = (n) => COLOURS[n] || FALLBACK;
const el = (tag, attrs) => {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, String(attrs[k]));
  return n;
};

/** Convex hull, counter-clockwise (monotone chain). */
function hull(points) {
  const pts = [...new Set(points.map((p) => `${p[0]},${p[1]}`))]
    .map((s) => s.split(',').map(Number))
    .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (const p of [...pts].reverse()) {
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

/** Single-link grouping of points by proximity, largest group first. */
function clusters(points, gap) {
  const parent = points.map((_, i) => i);
  const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  for (let i = 0; i < points.length; i++) {
    for (let j = i + 1; j < points.length; j++) {
      if (Math.hypot(points[i][0] - points[j][0], points[i][1] - points[j][1]) <= gap) {
        parent[find(i)] = find(j);
      }
    }
  }
  const groups = new Map();
  points.forEach((p, i) => {
    const r = find(i);
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(p);
  });
  return [...groups.values()].sort((a, b) => b.length - a.length);
}

// Collinear pinch points fix a length but no width, so the lens is drawn at this
// fraction of its length and the enclosing body engulfs the rest.
const WIDTH_RATIO = 0.15;

/** A lens outline through two pinch points, WIDTH_RATIO as wide as it is long. */
function lensEllipse(a, b) {
  const len = Math.hypot(a[0] - b[0], a[1] - b[1]);
  if (len <= 0) return [a];
  const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
  const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
  const semiLong = len / 2, semiWide = (len * WIDTH_RATIO) / 2;
  return Array.from({ length: 48 }, (_, k) => {
    const t = (2 * Math.PI * k) / 48;
    const along = semiLong * Math.cos(t), across = semiWide * Math.sin(t);
    return [cx + ux * along - uy * across, cy + uy * along + ux * across];
  });
}

/** The rings this rule draws for one body, in world coordinates. */
function ringsFor(body) {
  const pts = body.pinches;
  if (pts.length < 2) return [];
  if (pts.length === 2) return [lensEllipse(pts[0], pts[1])];
  if (rule === 'hull') return [hull(pts)];
  if (rule === 'angular') {
    const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
    const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
    return [[...pts].sort((a, b) => Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx))];
  }
  return clusters(pts, gapM)
    .filter((g) => g.length >= 2)
    .map((g) => (g.length >= 3 ? hull(g) : lensEllipse(g[0], g[1])));
}

function draw() {
  const svg = document.getElementById('map');
  svg.replaceChildren();
  const W = svg.clientWidth, H = svg.clientHeight;
  const X = (x) => (x - view.x) * view.k + W / 2;
  const Y = (y) => H / 2 - (y - view.y) * view.k;

  const g = el('g', {});
  svg.appendChild(g);

  for (const s of DATA.sections) {
    g.appendChild(el('polyline', {
      points: s.pts.map((p) => `${X(p[0])},${Y(p[1])}`).join(' '),
      fill: 'none', stroke: '#2b3b55', 'stroke-width': 1.4,
    }));
    for (const p of s.pts) {
      g.appendChild(el('circle', { cx: X(p[0]), cy: Y(p[1]), r: 2.2, fill: '#475569' }));
    }
  }

  const show = selected ? [selected] : DATA.bodies.filter((b) => b.pinches.length >= 2);
  for (const body of show) {
    const colour = colourFor(body.formation);
    const focused = selected && body.id === selected.id;
    for (const ring of ringsFor(body)) {
      if (ring.length < 3) continue;
      g.appendChild(el('polygon', {
        points: ring.map((p) => `${X(p[0])},${Y(p[1])}`).join(' '),
        fill: colour, 'fill-opacity': focused ? 0.42 : 0.16,
        stroke: colour, 'stroke-width': focused ? 2 : 1, 'stroke-opacity': focused ? 1 : 0.5,
      }));
    }
    if (focused) {
      // The body's own extent. The outlines cover only its terminations, so without
      // this a body that pinches out twice looks like two disconnected pieces.
      for (const run of body.runs || []) {
        g.appendChild(el('polyline', {
          points: run.map((p) => `${X(p[0])},${Y(p[1])}`).join(' '),
          fill: 'none', stroke: colour, 'stroke-width': 5, 'stroke-opacity': 0.95,
          'stroke-linecap': 'round',
        }));
      }
      for (const p of body.pinches) {
        g.appendChild(el('circle', {
          cx: X(p[0]), cy: Y(p[1]), r: 3.4, fill: '#fff', stroke: '#0b1220', 'stroke-width': 1,
        }));
      }
    }
  }

  // scale bar, so the grouping distance is judgeable against the ground
  const bar = 100 * view.k;
  g.appendChild(el('line', { x1: W - 30 - bar, y1: H - 26, x2: W - 30, y2: H - 26,
    stroke: '#94a3b8', 'stroke-width': 2 }));
  const t = el('text', { x: W - 30, y: H - 32, 'text-anchor': 'end', 'font-size': 11, fill: '#94a3b8' });
  t.textContent = '100 m';
  g.appendChild(t);
}

function paintNote() {
  const note = document.getElementById('note');
  note.replaceChildren();
  const p = document.createElement('div');
  for (const [text, em] of NOTES[rule]) {
    if (em) {
      const b = document.createElement('b');
      b.textContent = text;
      p.appendChild(b);
    } else {
      p.appendChild(document.createTextNode(text));
    }
  }
  note.appendChild(p);
  if (selected) {
    const n = ringsFor(selected).filter((r) => r.length >= 3).length;
    const extra = document.createElement('div');
    extra.style.marginTop = '7px';
    extra.style.color = '#e2e8f0';
    extra.textContent =
      `${selected.label} · ${selected.pinches.length} pinch points on ` +
      `${selected.pinchSections.length} section line(s) → ${n} outline${n === 1 ? '' : 's'}`;
    note.appendChild(extra);
    if (selected.pinchSections.length < 2) {
      const warn = document.createElement('div');
      warn.style.marginTop = '6px';
      warn.style.color = '#f0a04b';
      warn.textContent =
        'All its pinch points lie on one section line, so they are collinear and give ' +
        'the body no width. No rule can outline this from the data — it needs a shape ' +
        'assumption.';
      note.appendChild(warn);
    }
  }
  document.getElementById('gapRow').style.opacity = rule === 'clusters' ? '1' : '0.35';
}

function buildList() {
  const list = document.getElementById('list');
  list.replaceChildren();
  for (const body of DATA.bodies) {
    if (body.pinches.length < 2) continue;
    const row = document.createElement('div');
    row.className = 'row' + (selected && selected.id === body.id ? ' sel' : '');
    const sw = document.createElement('i');
    sw.className = 'sw';
    sw.style.background = colourFor(body.formation);
    const name = document.createElement('span');
    name.textContent = body.label;
    const flat = body.pinchSections.length < 2;
    if (flat) name.style.color = '#f0a04b';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = flat
      ? `${body.pinches.length} pts · 1 line`
      : `${body.pinches.length} pts · ${body.pinchSections.length} lines`;
    row.append(sw, name, n);
    row.addEventListener('click', () => {
      selected = selected && selected.id === body.id ? null : body;
      buildList();
      paintNote();
      draw();
    });
    list.appendChild(row);
  }
}

fetch('footprints.json').then((r) => r.json()).then((d) => {
  DATA = d;
  const xs = d.sections.flatMap((s) => s.pts.map((p) => p[0]));
  const ys = d.sections.flatMap((s) => s.pts.map((p) => p[1]));
  view.x = (Math.min(...xs) + Math.max(...xs)) / 2;
  view.y = (Math.min(...ys) + Math.max(...ys)) / 2;
  const svg = document.getElementById('map');
  view.k = Math.min(
    (svg.clientWidth * 0.86) / (Math.max(...xs) - Math.min(...xs) || 1),
    (svg.clientHeight * 0.86) / (Math.max(...ys) - Math.min(...ys) || 1),
  );

  const blurb = document.getElementById('blurb');
  blurb.replaceChildren();
  const twoD = d.bodies.filter((b) => b.pinchSections.length >= 2).length;
  const flat = d.bodies.filter((b) => b.pinchSections.length === 1 && b.pinches.length >= 2).length;
  const strong = document.createElement('b');
  strong.textContent = `${twoD} bodies pinch on 2+ section lines (a real outline) · ${flat} pinch on one line only (amber — collinear, no width)`;
  blurb.append(
    document.createTextNode('White dots are the pinch-out points your correlations already fix. ' +
      'The filled shape is the lens; everything outside it is matrix, whatever its lithology. '),
    strong,
    document.createTextNode('.'),
  );

  const bar = document.getElementById('rules');
  for (const r of RULES) {
    const b = document.createElement('button');
    b.textContent = LABEL[r];
    b.className = r === rule ? 'on' : '';
    b.addEventListener('click', () => {
      rule = r;
      for (const other of bar.children) other.className = other.textContent === LABEL[r] ? 'on' : '';
      paintNote();
      draw();
    });
    bar.appendChild(b);
  }

  const slider = document.getElementById('gap');
  slider.value = String(d.clusterGapM);
  gapM = d.clusterGapM;
  document.getElementById('gapVal').textContent = `${gapM} m`;
  slider.addEventListener('input', () => {
    gapM = Number(slider.value);
    document.getElementById('gapVal').textContent = `${gapM} m`;
    paintNote();
    draw();
  });

  // Every body at once is unreadable, so open on a representative lens.
  selected = d.bodies.find((b) => b.pinchSections.length >= 2 && b.pinches.length <= 6) || null;
  buildList();
  paintNote();
  draw();

  let drag = null;
  svg.addEventListener('mousedown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
  addEventListener('mouseup', () => { drag = null; });
  addEventListener('mousemove', (e) => {
    if (!drag) return;
    view.x -= (e.clientX - drag.x) / view.k;
    view.y += (e.clientY - drag.y) / view.k;
    drag = { x: e.clientX, y: e.clientY };
    draw();
  });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.k *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
    draw();
  }, { passive: false });
  addEventListener('resize', draw);
}).catch((e) => {
  document.getElementById('blurb').textContent =
    'Could not load footprints.json — run: uv run python scripts/dump_lens_footprints.py  (' + e + ')';
});
</script>
</body>
</html>
