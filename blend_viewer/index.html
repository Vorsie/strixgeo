<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pinching lens — what fills the space?</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --line: #334155;
    --ink: #e2e8f0; --dim: #94a3b8; --bad: #f87171; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 24px; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; max-width: 105ch; }
  .controls {
    display: flex; align-items: center; gap: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
  }
  input[type=range] { flex: 1; accent-color: #38bdf8; }
  .readout { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--dim); }
  .readout strong { color: var(--ink); }
  .cols { display: flex; gap: 14px; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  .col h2 { font-size: 13px; margin: 0 0 2px; font-weight: 600; }
  .col .note { font-size: 11.5px; color: var(--dim); min-height: 58px; margin-bottom: 6px; }
  .err { font-variant-numeric: tabular-nums; font-size: 12.5px; margin-top: 6px; }
  .zoomlabel { font-size: 10.5px; color: var(--dim); margin: 7px 0 3px; }
  svg { width: 100%; height: auto; display: block; background: #0b1220;
        border: 1px solid var(--line); border-radius: 6px; }
  .legend { margin-top: 14px; color: var(--dim); font-size: 12px; }
  .legend span { display: inline-block; margin-right: 14px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px;
        vertical-align: -1px; margin-right: 5px; border: 1px solid rgba(0,0,0,.4); }
</style>
</head>
<body>
<h1>A lens pinches out — what fills the space it vacates?</h1>
<div class="sub" id="sub">loading…</div>

<div class="controls">
  <span class="readout">on the section</span>
  <input type="range" id="slider" min="0" max="0" value="0" />
  <span class="readout">at the midline</span>
  <span class="readout" id="pos"></span>
</div>

<div class="cols" id="cols"></div>
<div class="legend" id="legend"></div>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOURS = {
  KLEI: '#7c8b5e', ZAND: '#e0a63c', SILT: '#b08d57', VEEN: '#5b4636',
  LEEM: '#c2a878', GRIND: '#9aa5b1', KEIEN: '#8b8b8b',
};
const FALLBACK = '#64748b';
const PANELS = [
  { key: 'reference', title: 'The section itself',
    note: 'The authored 2-D column on the section line — the reference. This is what you drew.' },
  { key: 'today', title: 'Today',
    note: 'The lens gives up thickness and nothing reserves the space, so everything beneath it rides up. Watch the base climb away from the blue line.' },
  { key: 'taper', title: 'A — the lens tapers to the far section',
    note: 'The lens fills the space reserved for it, thinning linearly and reaching zero AT the far section instead of halfway. Nothing unknown, nothing invented.' },
  { key: 'hold', title: 'B — dies at the midline, rest unknown',
    note: 'The lens keeps exactly the thickness it has today and still dies at the midline. The space it stops filling is left UNKNOWN — the dark bands.' },
  { key: 'host', title: 'C — dies at the midline, host closes over',
    note: 'The lens keeps today’s thickness and dies at the midline; the units above and below it grow into the space, half each.' },
];

let DATA = null;
const colourFor = (name) => COLOURS[name] || FALLBACK;

function svgEl(tag, attrs) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, String(attrs[k]));
  return n;
}
function htmlEl(tag, className, text) {
  const n = document.createElement(tag);
  if (className) n.className = className;
  if (text !== undefined) n.textContent = text;
  return n;
}

function draw(units, lo, hi, correctBase, H) {
  const W = 200, padT = 10, padB = 26, padL = 44, padR = 10;
  const plotH = H - padT - padB;
  const y = (e) => padT + ((hi - e) / (hi - lo)) * plotH;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'xMidYMin meet' });

  const span = hi - lo;
  const step = span > 24 ? 5 : span > 8 ? 2 : span > 3 ? 1 : 0.5;
  for (let e = Math.ceil(lo / step) * step; e <= hi; e += step) {
    svg.appendChild(svgEl('line', {
      x1: padL - 4, y1: y(e), x2: W - padR, y2: y(e), stroke: '#1e293b',
    }));
    const t = svgEl('text', {
      x: padL - 7, y: y(e) + 3.5, 'text-anchor': 'end', 'font-size': 10, fill: '#64748b',
    });
    t.textContent = step < 1 ? e.toFixed(1) : e.toFixed(0);
    svg.appendChild(t);
  }

  for (const u of units) {
    const name = DATA.formations[u.formation] || '?';
    const top = y(u.top);
    const h = Math.max(y(u.base) - top, 0.6);
    svg.appendChild(svgEl('rect', {
      x: padL, y: top, width: W - padL - padR, height: h,
      fill: colourFor(name), stroke: '#0b1220', 'stroke-width': 0.6,
    }));
    if (h > 11) {
      const t = svgEl('text', {
        x: padL + 7, y: top + h / 2 + 3.5, 'font-size': 10.5,
        fill: 'rgba(0,0,0,.72)', 'font-weight': 600,
      });
      t.textContent = name;
      svg.appendChild(t);
    }
    if (u.lens && h > 2) {
      svg.appendChild(svgEl('rect', {
        x: padL, y: top, width: W - padL - padR, height: h,
        fill: 'none', stroke: '#fbbf24', 'stroke-width': 1.6, 'stroke-dasharray': '4 2',
      }));
    }
  }

  if (correctBase !== null) {
    svg.appendChild(svgEl('line', {
      x1: padL - 6, y1: y(correctBase), x2: W - padR, y2: y(correctBase),
      stroke: '#38bdf8', 'stroke-width': 1.4, 'stroke-dasharray': '5 3',
    }));
  }
  return svg;
}

function render(i) {
  const s = DATA.samples[i];
  const cols = document.getElementById('cols');
  cols.replaceChildren();

  let lo = Infinity, hi = -Infinity;
  for (const set of [DATA.reference, s.today, s.taper, s.hold, s.host]) {
    for (const u of set) { lo = Math.min(lo, u.base); hi = Math.max(hi, u.top); }
  }
  lo = Math.min(lo, s.correctBase) - 0.6;
  hi += 0.6;

  const zLo = s.correctBase - 1.6, zHi = s.correctBase + 1.6;
  for (const p of PANELS) {
    const units = p.key === 'reference' ? DATA.reference : s[p.key];
    const col = htmlEl('div', 'col');
    col.appendChild(htmlEl('h2', null, p.title));
    col.appendChild(htmlEl('div', 'note', p.note));
    col.appendChild(draw(units, lo, hi, p.key === 'reference' ? null : s.correctBase, 330));
    col.appendChild(htmlEl('div', 'zoomlabel', 'the bottom 3.2 m, magnified'));
    col.appendChild(draw(units, zLo, zHi, p.key === 'reference' ? null : s.correctBase, 150));

    const base = units.length ? Math.min(...units.map((u) => u.base)) : null;
    const err = htmlEl('div', 'err');
    if (base === null) {
      err.textContent = 'empty';
    } else if (p.key === 'reference') {
      err.style.color = 'var(--dim)';
      err.textContent = `base ${base.toFixed(3)} m`;
    } else {
      const d = base - s.correctBase;
      const good = Math.abs(d) < 0.005;
      err.style.color = good ? 'var(--ok)' : 'var(--bad)';
      err.textContent = good
        ? `base ${base.toFixed(3)} m · on target`
        : `base ${base.toFixed(3)} m · ${(d > 0 ? '+' : '') + d.toFixed(3)} m too high`;
    }
    col.appendChild(err);
    cols.appendChild(col);
  }

  const pos = document.getElementById('pos');
  pos.replaceChildren();
  const a = htmlEl('strong', null, `${s.travel.toFixed(2)} m`);
  const b = htmlEl('strong', null, s.w1.toFixed(3));
  const c = htmlEl('strong', null, `${s.correctBase.toFixed(3)} m`);
  pos.append(a, document.createTextNode(' off the section · weight '), b,
             document.createTextNode(' · target base '), c);
}

fetch('model.json').then((r) => r.json()).then((d) => {
  DATA = d;
  document.getElementById('sub').textContent =
    `Gap ${d.gap} at fraction ${d.fraction}, walking ${(d.distanceM / 2).toFixed(1)} m toward ` +
    `${d.towards}. Dashed gold outlines the unit that is pinching out. Dashed blue is where the ` +
    `base should be — the interpolation of the two sections' own bases. Drag the slider to walk ` +
    `off the section and watch the lens die.`;

  const seen = new Set();
  for (const u of d.reference) seen.add(d.formations[u.formation] || '?');
  for (const s of d.samples) for (const u of s.today) seen.add(d.formations[u.formation] || '?');
  const legend = document.getElementById('legend');
  legend.replaceChildren();
  for (const n of seen) {
    const span = document.createElement('span');
    const sw = document.createElement('i');
    sw.className = 'sw';
    sw.style.background = colourFor(n);
    span.append(sw, document.createTextNode(n));
    legend.appendChild(span);
  }

  const sl = document.getElementById('slider');
  sl.max = String(d.samples.length - 1);
  sl.addEventListener('input', () => render(Number(sl.value)));
  render(0);
}).catch((e) => {
  document.getElementById('sub').textContent =
    'Could not load model.json — run: uv run python scripts/dump_blend_compare.py  (' + e + ')';
});
</script>
</body>
</html>
