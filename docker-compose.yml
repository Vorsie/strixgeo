services:
  db:
    # Digest-pinned (#219) so the DB image is reproducible — a floating
    # 16-3.4 tag can silently change under the project. Refresh the digest
    # deliberately with: docker pull postgis/postgis:16-3.4 && docker
    # inspect --format '{{index .RepoDigests 0}}' postgis/postgis:16-3.4
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    environment:
      POSTGRES_USER: groundmodel
      POSTGRES_PASSWORD: groundmodel
      POSTGRES_DB: groundmodel
    ports:
      # Loopback-only bind (debt #215). A bare "5433:5432" binds 0.0.0.0, so on
      # a shared office/lab machine anyone on the LAN could reach Postgres with
      # the default groundmodel:groundmodel credentials and read all project
      # data. Random per-install password generation folds into the bundled-
      # Postgres plan (#2). Recreate the container (docker compose up -d) for
      # this to take effect.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundmodel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
