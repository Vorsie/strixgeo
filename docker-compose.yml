services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: groundmodel
      POSTGRES_PASSWORD: groundmodel
      POSTGRES_DB: groundmodel
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundmodel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
