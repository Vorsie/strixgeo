# Dependabot version updates. Security updates come from Dependabot
# security updates (enabled in the repository settings, together with the
# alerts); the "*-security" groups (applies-to: security-updates) only bundle
# them into one PR per ecosystem. Security PRs have their own fixed limit:
# open-pull-requests-limit applies to version updates only.
#
# One version-update group per ecosystem, weekly on Monday morning, so the
# repository gets at most three version-update PRs a week. Bot commits carry no
# Signed-off-by; the DCO job in ci.yml skips Dependabot PRs and a
# maintainer reviews and merges them.
#
# The Python dependencies use the "uv" ecosystem: the project is locked
# with uv.lock, which the "pip" ecosystem does not update.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-deps:
        patterns:
          - "*"
      desktop-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # A major Electron release changes the runtime under the whole app
      # (Chromium, Node, the IPC and sandbox defaults); it is a planned
      # upgrade, not a weekly bump.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
