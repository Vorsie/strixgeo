# Dependabot version updates. Security updates come from Dependabot
# security updates (enabled in the repository settings, together with the
# alerts); the "*-security" groups (applies-to: security-updates) only bundle
# them into one PR per ecosystem. Security PRs have their own fixed limit:
# open-pull-requests-limit applies to version updates only.
#
# One version-update group per ecosystem, monthly morning, so the
# repository gets at most three version-update PRs a month. The groups carry
# only minor and patch updates, and the uv and npm ecosystems ignore every
# major update: a major (React, Tailwind, TypeScript, Vite, a new pytest) is
# a planned upgrade by hand, with its own branch and its own tests, never a
# bot PR. Bot commits carry no Signed-off-by; the DCO job in ci.yml skips
# Dependabot PRs and a maintainer reviews and merges them.
#
# The Python dependencies use the "uv" ecosystem: the project is locked
# with uv.lock, which the "pip" ecosystem does not update.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      desktop-deps:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
      desktop-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Every major, Electron first of all: a major Electron release changes
      # the runtime under the whole app (Chromium, Node, the IPC and sandbox
      # defaults), a major React / Tailwind / TypeScript / Vite release
      # changes the build; each is a planned upgrade, not a monthly bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Brussels"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
