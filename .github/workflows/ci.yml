# Strix CI — runs the same fast gate the local pre-commit hook
# enforces, but on the GitHub side so the gate survives anyone
# committing with ``--no-verify``. Mirrors the pre-commit hook's
# strategy: skip-when-irrelevant + fail-fast on the cheap signal.
#
# Why a workflow this small for a solo dev: the moment a second
# contributor (or a paid customer running off ``main``) lands,
# the safety net has to live somewhere other than the author's
# laptop. See debt #6 in CLAUDE.md "Known Architectural Debt".
#
# Two parallel jobs:
#   * **python** — Python 3.11 + uv. Runs ``pytest tests/unit``.
#   * **desktop** — Node 22 LTS (pinned per debt-resolved Node 22
#     constraint). Runs ``npx tsc --noEmit`` + ``npm test``.
#
# Integration tests (``tests/integration/``) are skipped here —
# they need a live Postgres + PostGIS stack which adds complexity
# we don't yet need. Promote when the desktop side is ready for
# end-to-end smoke runs.
#
# Trigger policy (revised 2026-05-18 — GitHub Actions quota):
#   * NO ``push: develop``. The active dogfeed branch is gated on every
#     commit by the LOCAL pre-commit hook, which runs this exact same
#     suite (pytest unit + desktop tsc + Vitest). CI on every develop
#     push was almost pure redundancy for a solo pre-revenue dev and
#     was the dominant Actions spend.
#   * ``push: main`` only — the rare release surface this gate exists to
#     protect (see the "paid customer off main" rationale above).
#   * ``pull_request`` — the unconditional review gate (no paths-ignore
#     so a PR is always fully checked).
#   * ``workflow_dispatch`` — manual on-demand full run on any branch
#     (e.g. before a coworker handoff) without re-enabling auto.
#   * ``paths-ignore`` on push — docs/markdown-only commits to main
#     don't spin the matrix.
#
#   RE-ARM TRIGGER: restore ``push: develop`` (or branch-protect main +
#   require this check) the moment a SECOND contributor or a paid
#   customer lands — see CLAUDE.md "Known Architectural Debt" #6. Until
#   then the local hook is the develop safety net.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]

# Cancel queued runs from the same branch when a newer push lands —
# saves CI minutes on rapid push cycles. The latest commit's run is
# always the authoritative one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3 (SHA-pinned, #219)
        with:
          # Pin uv major-minor so future breaking changes don't
          # surprise CI. Bump explicitly when the local dev env
          # moves.
          version: "0.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        run: uv run pytest tests/unit -q

  desktop:
    name: Desktop eslint-reason + tsc + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)

      - name: Set up Python 3.11
        # Needed for the eslint-reason script that runs first.
        # No deps beyond stdlib so no requirements install.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (SHA-pinned, #219)
        with:
          python-version: "3.11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned, #219)
        with:
          # Node 22 LTS is load-bearing — Node 24.15 segfaults on
          # the vite/vitest static-ESM resolver path. CLAUDE.md
          # § "Tech Stack" carries the full diagnosis.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check eslint-disable reason comments (debt #42)
        run: python scripts/check_eslint_reason.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check
        working-directory: desktop
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: desktop
        run: npm test --silent

      # Supply-chain visibility (#219). Informational only — continue-on-error
      # so a freshly-disclosed advisory in a transitive dep never blocks a
      # release build; the signal surfaces in the log for triage. Promote to a
      # blocking gate once the dependency surface is actively curated.
      - name: Audit npm dependencies (informational)
        working-directory: desktop
        continue-on-error: true
        run: npm audit --audit-level=high
