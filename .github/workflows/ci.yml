# Strix CI: runs the same gates the local git hooks enforce, but on the
# GitHub side so they survive anyone committing with ``--no-verify`` and
# so every outside pull request is checked before review.
#
# Five jobs, one per required check of the open-source design. Their
# ``name:`` values are the branch-protection required contexts and are
# quoted verbatim in CONTRIBUTING.md; rename them in all three places
# together or the protection rule waits for a check that never reports.
#   * **lint-types** (Ruff + mypy): ruff check, ruff format --check, and
#     mypy (strict, blocking).
#   * **python-unit** (Python unit tests): Python 3.11 + uv, ``pytest
#     tests/unit``.
#   * **desktop** (Desktop eslint-reason + tsc + tests): Node 22 LTS
#     (pinned per the Node 22 constraint), the eslint-reason script, tsc
#     on all three tsconfigs, Vitest.
#   * **integration** (Integration tests (PostGIS service)): the
#     integration suite against a PostGIS service container. This is the
#     CI twin of scripts/run-integration-tests.ps1: migrate the
#     ``groundmodel_integration`` DB to head, then pytest. Tests that need
#     the gitignored ``data/cpt/`` or real PDF reports skip themselves,
#     and the DOV live tests skip when DOV is unreachable.
#   * **dco** (DCO sign-off): pull requests only; every commit of the PR
#     must carry a Signed-off-by trailer.
#
# Trigger policy (revised 2026-09-22, owner: "go ahead", at 90 % of the
# month's Actions minutes after a day of ~30 runs):
#   * ``push: [main]`` only. Since the branch model (2026-09-16) every
#     landing on develop is a rebase-merged PR whose content the
#     ``pull_request`` run already checked; the develop push re-ran the
#     same gate on the same tree (~35 job-minutes per landing, ~40 % of
#     the month). main still runs on push because a release is a
#     fast-forward of develop, not a PR. STRIX_BATCH landings are covered
#     by the PR run of the very same commits.
#   * ``pull_request``: the unconditional review gate (no paths-ignore
#     so a PR is always fully checked).
#   * ``workflow_dispatch``: manual on-demand full run on any branch
#     (e.g. before a coworker handoff).
#   * ``schedule``: a weekly server-side run so develop is verified even
#     in a quiet week with no push (production-readiness audit 2026-09-02,
#     L10). A scheduled run's workflow file is read from the repository's
#     DEFAULT branch (main, which trails develop), so the checkout step
#     pins ``ref: develop`` for scheduled runs only; the weekly run then
#     verifies the branch we actually push to. Push/PR runs keep the ref
#     that triggered them.
#   * ``paths-ignore`` on push: docs/markdown-only pushes don't spin
#     the matrix.

name: CI

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC. Jobs are unchanged — this only adds a cadence.
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]

# Cancel queued runs from the same branch when a newer push lands —
# saves CI minutes on rapid push cycles. The latest commit's run is
# always the authoritative one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-types:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)
        with:
          # Scheduled runs check develop; push/PR runs use the triggering ref
          # (the python-unit job carries the full reason).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3 (SHA-pinned, #219)
        with:
          version: "0.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy
        run: uv run mypy src

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    # The suite is ~80 s locally; 25 min is generous head-room. The cap exists
    # because the FIRST re-armed develop run hung in this step for 1 h+ (cause
    # unknown, Linux-only) — without it a hang burns the 360-min default.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)
        with:
          # A scheduled run's workflow is read from the default branch (main,
          # which trails develop). Pin develop for the weekly run so it checks
          # the branch we push to; push/PR runs pass an empty ref, which is
          # actions/checkout's default (the ref/SHA that triggered the run).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3 (SHA-pinned, #219)
        with:
          # Pin uv major-minor so future breaking changes don't
          # surprise CI. Bump explicitly when the local dev env
          # moves.
          version: "0.5"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run unit tests
        # faulthandler_timeout: pytest's built-in faulthandler dumps every
        # thread's stack when a single test exceeds 120 s (no test should come
        # near that). It does not kill the run — it makes a hang
        # self-diagnosing in the log instead of ending as a silent
        # timeout-minutes cancellation with no traceback. It is an INI option,
        # not a CLI flag (``--faulthandler-timeout`` is pytest usage-error
        # exit 4 — validated locally with ``-o`` before this line changed).
        run: uv run pytest tests/unit -q -o faulthandler_timeout=120

  desktop:
    name: Desktop eslint-reason + tsc + tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)
        with:
          # A scheduled run's workflow is read from the default branch (main,
          # which trails develop). Pin develop for the weekly run so it checks
          # the branch we push to; push/PR runs pass an empty ref, which is
          # actions/checkout's default (the ref/SHA that triggered the run).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Set up Python 3.11
        # Needed for the eslint-reason script that runs first.
        # No deps beyond stdlib so no requirements install.
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 (SHA-pinned, #219)
        with:
          python-version: "3.11"

      - name: Set up Node 22 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SHA-pinned, #219)
        with:
          # Node 22 LTS is load-bearing — Node 24.15 segfaults on
          # the vite/vitest static-ESM resolver path. CLAUDE.md
          # § "Tech Stack" carries the full diagnosis.
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check eslint-disable reason comments (debt #42)
        run: python scripts/check_eslint_reason.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Type-check
        working-directory: desktop
        # Explicit -p flags are load-bearing (debt #63, mirrored from the
        # pre-commit hook): the root tsconfig.json has empty ``files`` +
        # project ``references``, so a bare ``tsc --noEmit`` silently checks
        # NOTHING. All three projects run: renderer (web), main + preload
        # (node), and the Playwright specs (e2e).
        run: |
          npx tsc --noEmit -p tsconfig.web.json
          npx tsc --noEmit -p tsconfig.node.json
          npx tsc --noEmit -p tsconfig.e2e.json

      - name: Run unit tests
        working-directory: desktop
        run: npm test --silent

      # Supply-chain visibility (#219). Informational only — continue-on-error
      # so a freshly-disclosed advisory in a transitive dep never blocks a
      # release build; the signal surfaces in the log for triage. Promote to a
      # blocking gate once the dependency surface is actively curated.
      - name: Audit npm dependencies (informational)
        working-directory: desktop
        continue-on-error: true
        run: npm audit --audit-level=high

  integration:
    name: Integration tests (PostGIS service)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        # Same digest-pinned image as docker-compose.yml (#219). The image's
        # init script creates the postgis extension in POSTGRES_DB, which is
        # what the local bootstrap in docs/testing-integration.md does by hand.
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_USER: groundmodel
          POSTGRES_PASSWORD: groundmodel
          POSTGRES_DB: groundmodel_integration
        ports:
          # Host port 5433 as in docker-compose.yml: the migration-parity test
          # (tests/integration/db/test_migration_upgrade_from_empty.py) dials
          # 127.0.0.1:5433 directly and skips when nothing answers there.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U groundmodel -d groundmodel_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The integration conftest refuses any DB whose name does not end in
      # _integration or _test, and alembic's env.py honours DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://groundmodel:groundmodel@127.0.0.1:5433/groundmodel_integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)
        with:
          # Scheduled runs check develop; push/PR runs use the triggering ref
          # (the python-unit job carries the full reason).
          ref: ${{ github.event_name == 'schedule' && 'develop' || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3 (SHA-pinned, #219)
        with:
          version: "0.5"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Create the maintenance database
        # The migration-parity test issues CREATE/DROP DATABASE for its
        # scratch DB over a connection to the ``groundmodel`` DB, which
        # exists locally as the dev DB. In CI it is an empty placeholder;
        # no test reads or writes a table in it.
        env:
          PGPASSWORD: groundmodel
        run: psql -h 127.0.0.1 -p 5433 -U groundmodel -d groundmodel_integration -c "CREATE DATABASE groundmodel"

      - name: Migrate the integration database
        run: uv run alembic upgrade head

      - name: Run integration tests
        # Same faulthandler reasoning as the unit job; 300 s per test because
        # the migration-parity test runs a full alembic upgrade in a
        # subprocess.
        run: uv run pytest tests/integration -q -o faulthandler_timeout=300

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (SHA-pinned, #219)
        with:
          # Full history so both ends of base..head resolve.
          fetch-depth: 0

      - name: Every commit of the PR carries Signed-off-by
        # Only the PR's own commits (base.sha..head.sha), never the whole
        # history: the commits made before the repository went public carry
        # no sign-off and must never fail this check.
        run: bash scripts/check_dco.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
